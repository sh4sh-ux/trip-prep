<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="#F7F7F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="여행 준비">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>여행 준비</title>
<style>
:root{
  --bg:#F7F7F8;--card:#fff;
  --label:#111;--label2:#666;--label3:#B0B0B8;
  --sep:#EBEBED;--sep2:#D4D4D8;--fill:#F3F3F5;--fill2:#F8F8FA;
  --blue:#0071E3;--blue-bg:#EBF3FF;--blue-txt:#0055B8;
  --green:#1DAD53;--green-bg:#EDFAF3;--green-txt:#13823D;
  --red:#E53E3E;--red-bg:#FFF0F0;
  --orange:#F08C00;--orange-bg:#FFF6E5;--orange-txt:#B36B00;
  --r:16px;--rm:10px;--rs:9px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);font-family:-apple-system,'SF Pro Text','Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;
  font-size:14px;color:var(--label);min-height:100vh;-webkit-text-size-adjust:100%;}
button{font-family:inherit;cursor:pointer;border:none;background:transparent;color:inherit;font-size:inherit;}
input,select,textarea{font-family:inherit;font-size:16px;}
svg{display:block;flex-shrink:0;}
.app{max-width:520px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;overflow-x:hidden;}

/* ---------- 헤더 ---------- */
.hd{background:var(--card);padding:max(14px,calc(env(safe-area-inset-top,0px) + 10px)) 20px 0;
  border-bottom:1px solid var(--sep);position:sticky;top:0;z-index:30;}
.hd-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px;}
.trip-btn{text-align:left;flex:1;min-width:0;display:flex;align-items:flex-start;gap:6px;}
.trip-name{font-size:21px;font-weight:700;letter-spacing:-.5px;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.trip-caret{margin-top:7px;color:var(--label3);}
.trip-meta{font-size:12.5px;color:var(--label2);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.dot-sep{width:2.5px;height:2.5px;border-radius:50%;background:var(--label3);display:inline-block;flex-shrink:0;}
.hd-right{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.dday{background:var(--label);color:#fff;font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px;letter-spacing:-.2px;}
.dday.done{background:var(--fill);color:var(--label2);}
.icon-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--label2);}
.icon-btn:active{background:var(--fill);}
.tabs{display:flex;}
.tab{flex:1;font-size:13.5px;font-weight:500;color:var(--label2);padding:11px 0 12px;border-bottom:2px solid transparent;transition:all .15s;}
.tab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600;}
.body{padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 48px);}

/* ---------- 공용 ---------- */
.sec{background:var(--card);border-radius:var(--r);overflow:hidden;margin-bottom:12px;}
.sec-hd{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;}
.sec-title{font-size:11.5px;font-weight:600;color:var(--label2);letter-spacing:.4px;text-transform:uppercase;}
.sec-note{font-size:12px;color:var(--label3);font-weight:500;}
.row{display:flex;align-items:center;gap:11px;padding:12px 16px;position:relative;}
.sec-hd::after,.row::after{content:'';position:absolute;left:16px;right:16px;bottom:0;height:1px;background:var(--sep);}
.row:last-child::after{display:none;}
.acc-body .row::after{left:20px;}
.grow{flex:1;min-width:0;}
button.tap{text-align:left;background:transparent;border:none;padding:0;font:inherit;color:inherit;}
.step{display:flex;align-items:center;border:1px solid var(--sep2);border-radius:var(--rs);
  overflow:hidden;width:160px;}
.step-b{width:48px;height:46px;font-size:21px;font-weight:600;color:var(--label2);background:var(--fill2);}
.step-b:active{background:var(--sep);}
.step-i{flex:1;min-width:0;text-align:center;border:none;outline:none;height:46px;
  font-size:17px;font-weight:700;background:var(--card);color:var(--label);appearance:textfield;}
.step-i::-webkit-outer-spin-button,.step-i::-webkit-inner-spin-button{appearance:none;margin:0;}

/* 날짜·시간 피커 (두 번째 시트 레이어) */
.dim2{z-index:110;}
.sheet2{z-index:111;}
.fld-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;
  text-align:left;background:var(--bg);font-size:15px;font-weight:500;cursor:pointer;}
.fld-btn .ph{color:var(--label3);font-weight:400;}
.fld-btn .ic{color:var(--label3);flex-shrink:0;}
.cal-hd{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 12px;}
.cal-title{font-size:15.5px;font-weight:700;letter-spacing:-.2px;}
.cal-nav{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:var(--label2);}
.cal-nav:active{background:var(--fill);}
.cal-nav:disabled{color:#DCDCE0;}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
.cal-dow span{text-align:center;font-size:11.5px;font-weight:600;color:var(--label3);padding:4px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-c{height:44px;}
.cal-d{width:40px;height:40px;margin:2px auto;border-radius:50%;font-size:14.5px;font-weight:500;
  color:var(--label);display:flex;align-items:center;justify-content:center;}
.cal-d.sun{color:#E5484D;} .cal-d.sat{color:#3E63DD;}
.cal-d.today{font-weight:800;text-decoration:underline;text-underline-offset:3px;}
.cal-d.on{background:var(--label);color:#fff;font-weight:700;}
.cal-d.dis{color:#DCDCE0;} .cal-d.dis.sun,.cal-d.dis.sat{color:#DCDCE0;}
.cal-d:not(.dis):not(.on):active{background:var(--fill);}
.pk-sec{margin-top:16px;}
.pk-now{font-size:13px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;}
.time-in{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 6px;}
.tin{width:66px;height:48px;text-align:center;font-size:21px;font-weight:700;border:1px solid var(--sep2);
  border-radius:var(--rs);background:var(--bg);color:var(--label);outline:none;font-variant-numeric:tabular-nums;}
.tin:focus{border-color:var(--blue);background:var(--card);}
.tcolon{font-size:21px;font-weight:700;color:var(--label2);}
.tundo{margin-left:6px;font-size:13px;font-weight:600;color:var(--label2);height:48px;padding:0 14px;
  border:1px solid var(--sep2);border-radius:var(--rs);background:var(--card);}
.tundo.on{background:var(--label);border-color:var(--label);color:#fff;}
.wheels{position:relative;display:flex;justify-content:center;gap:20px;height:180px;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 32%,#000 68%,transparent);
          mask-image:linear-gradient(180deg,transparent,#000 32%,#000 68%,transparent);}
.wheel{height:180px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;padding:70px 0;
  -webkit-overflow-scrolling:touch;}
.wheel::-webkit-scrollbar{display:none;}
.wheel-i{height:40px;line-height:40px;scroll-snap-align:center;width:78px;text-align:center;
  font-size:18px;font-weight:500;color:var(--label3);transition:color .1s,font-size .1s;}
.wheel-i.sel{color:var(--label);font-weight:800;font-size:20px;}
.wheel-band{position:absolute;left:50%;transform:translateX(-50%);width:180px;top:70px;height:40px;
  border-top:1px solid var(--sep2);border-bottom:1px solid var(--sep2);pointer-events:none;}
.txt{font-size:14px;line-height:1.35;word-break:break-word;}
.tiny{font-size:11.5px;color:var(--label3);margin-top:2px;line-height:1.35;}
.pill-tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;flex-shrink:0;}
.tag-cold{background:var(--blue-bg);color:var(--blue-txt);}
.tag-auto{background:var(--green-bg);color:var(--green-txt);}

.cb{width:22px;height:22px;border-radius:50%;border:1.6px solid var(--sep2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;background:var(--card);transition:all .16s;}
.cb.on{background:var(--green);border-color:var(--green);}
.cb svg{opacity:0;transform:scale(.5);transition:all .16s;}
.cb.on svg{opacity:1;transform:scale(1);}
.done .txt{color:var(--label3);text-decoration:line-through;text-decoration-color:var(--sep2);}
.done .tiny{color:#CFCFD6;}
.qty{font-size:13px;font-weight:600;color:var(--label2);flex-shrink:0;font-variant-numeric:tabular-nums;}
.done .qty{color:var(--label3);}
.del-x{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--label3);flex-shrink:0;}
.del-x:active{background:var(--red-bg);color:var(--red);}

.prog-wrap{padding:15px 16px 16px;background:var(--card);border-radius:var(--r);margin-bottom:12px;}
.prog-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px;gap:8px;}
.prog-lab{font-size:13px;font-weight:600;}
.prog-num{font-size:13px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;}
.bar{height:7px;border-radius:4px;background:var(--fill);overflow:hidden;}
.bar i{display:block;height:100%;border-radius:4px;background:var(--blue);transition:width .35s cubic-bezier(.25,.8,.25,1);}
.bar i.full{background:var(--green);}

.acc-hd{display:flex;align-items:center;gap:10px;padding:13px 16px;width:100%;text-align:left;position:relative;}
.acc-hd::after{content:'';position:absolute;left:16px;right:16px;bottom:0;height:1px;background:var(--sep);}
.acc-ic{width:26px;text-align:center;font-size:16px;flex-shrink:0;}
.acc-name{font-size:14px;font-weight:600;flex:1;}
.acc-count{font-size:12px;font-weight:600;color:var(--label3);font-variant-numeric:tabular-nums;}
.acc-count.full{color:var(--green-txt);}
.chev{transition:transform .22s;color:var(--label3);}
.acc.open .chev{transform:rotate(90deg);}
.acc-body{display:none;background:var(--fill2);}
.acc.open .acc-body{display:block;}
.acc:last-child .acc-hd::after{display:none;}
.acc.open:last-child .acc-hd::after{display:block;}

.menu-grid{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px;}
.mchip{display:flex;align-items:center;gap:6px;border:1px solid var(--sep2);border-radius:22px;
  padding:8px 13px 8px 11px;font-size:13.5px;font-weight:500;color:var(--label2);background:var(--card);transition:all .14s;}
.mchip .e{font-size:15px;}
.mchip.on{background:var(--label);border-color:var(--label);color:#fff;font-weight:600;}
.mchip.on .cnt{color:rgba(255,255,255,.6);}
.cnt{font-size:11px;color:var(--label3);font-weight:500;}
.menu-off .txt{color:var(--label2);} .menu-off .tiny{color:var(--label3);}
.menu-more{display:flex;align-items:center;gap:8px;width:100%;padding:11px 16px;text-align:left;position:relative;background:var(--fill2);}
.menu-more::after{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:var(--sep);}
.mm-lab{font-size:12.5px;font-weight:600;color:var(--label2);}
.mm-cnt{font-size:11px;font-weight:700;color:var(--label3);background:var(--fill);padding:1px 8px;border-radius:9px;font-variant-numeric:tabular-nums;}
.menu-more .chev{margin-left:auto;}
.menu-more.open .chev{transform:rotate(90deg);}
.menu-more-body{background:var(--fill2);}
.src{color:var(--green-txt);font-weight:500;}
.flash{animation:flash .6s ease;}
@keyframes flash{0%{background:#FFF6D9;}100%{background:transparent;}}

.tl{padding:4px 16px 14px;}
.tl-item{display:flex;gap:12px;position:relative;padding:11px 0;}
.tl-item::before{content:'';position:absolute;left:5.5px;top:26px;bottom:-11px;width:1.5px;background:var(--sep);}
.tl-item:last-child::before{display:none;}
.tl-dot{width:13px;height:13px;border-radius:50%;border:2.5px solid var(--sep2);background:var(--card);flex-shrink:0;margin-top:4px;z-index:1;}
.tl-item.now .tl-dot{border-color:var(--blue);background:var(--blue);box-shadow:0 0 0 4px var(--blue-bg);}
.tl-item.past .tl-dot{background:var(--sep2);border-color:var(--sep2);}
.tl-time{font-size:12px;font-weight:600;color:var(--label2);font-variant-numeric:tabular-nums;}
.tl-item.now .tl-time{color:var(--blue);}
.tl-title{font-size:14px;font-weight:600;margin-top:1px;word-break:break-word;}
.tl-item.past .tl-title,.tl-item.past .tl-time{color:var(--label3);}

.hero{background:var(--card);border-radius:var(--r);padding:18px 16px;margin-bottom:12px;}
.hero-lab{font-size:11.5px;font-weight:600;color:var(--label2);letter-spacing:.4px;text-transform:uppercase;margin-bottom:8px;}
.hero-big{font-size:26px;font-weight:700;letter-spacing:-.6px;}
.hero-sub{font-size:12.5px;color:var(--label2);margin-top:5px;}
.hero-sub b{font-weight:700;color:var(--label);}

.banner{display:flex;gap:10px;align-items:flex-start;background:var(--orange-bg);border-radius:var(--rm);padding:12px 14px;margin-bottom:12px;}
.banner .bi{font-size:15px;line-height:1.3;}
.banner-t{font-size:13px;font-weight:600;color:var(--orange-txt);}
.banner-d{font-size:12px;color:var(--orange-txt);opacity:.85;margin-top:2px;line-height:1.45;}
.banner.g{background:var(--green-bg);}.banner.g .banner-t,.banner.g .banner-d{color:var(--green-txt);}
.banner.b{background:var(--blue-bg);}.banner.b .banner-t,.banner.b .banner-d{color:var(--blue-txt);}

.addbtn{width:100%;padding:13px;font-size:13.5px;font-weight:500;color:var(--label2);
  display:flex;align-items:center;justify-content:center;gap:6px;}
.addbtn .plus{width:20px;height:20px;border-radius:50%;background:var(--green-bg);color:var(--green-txt);
  display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;}

.seg{display:flex;gap:2px;background:var(--fill);border-radius:10px;padding:3px;margin-bottom:12px;}
.seg button{flex:1;font-size:13px;font-weight:500;color:var(--label2);padding:7px 0;border-radius:8px;transition:all .15s;}
.seg button.on{background:var(--card);color:var(--label);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.07);}

.dayseg{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:2px;scrollbar-width:none;}
.dayseg::-webkit-scrollbar{display:none;}
.dchip{flex-shrink:0;border:1px solid var(--sep2);border-radius:20px;padding:7px 13px;font-size:12.5px;
  font-weight:500;color:var(--label2);background:var(--card);white-space:nowrap;}
.dchip.on{background:var(--label);border-color:var(--label);color:#fff;font-weight:600;}
.dchip small{display:block;font-size:10.5px;opacity:.65;font-weight:400;margin-top:1px;}

.drag-h{width:44px;height:36px;display:flex;align-items:center;justify-content:center;
  color:var(--label3);flex-shrink:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;}
.drag-h:active{color:var(--label);cursor:grabbing;}
.dragging{opacity:.94;background:var(--card);box-shadow:0 6px 22px rgba(0,0,0,.16);
  border-radius:10px;position:relative;z-index:6;}
.pack-tpl{margin-top:14px;text-align:center;}
.pack-tpl button{font-size:13px;font-weight:600;color:var(--blue-txt);padding:9px 14px;border-radius:9px;background:var(--blue-bg);width:100%;}
.pack-tpl button:active{opacity:.7;}
.pack-tpl button.reset{margin-top:8px;color:var(--label2);background:var(--fill);font-weight:500;}
.mkt-tools{display:flex;justify-content:flex-end;gap:8px;margin:-2px 2px 10px;}
.mkt-tools button{font-size:12.5px;font-weight:600;color:var(--label2);padding:6px 11px;border-radius:8px;background:var(--fill);white-space:nowrap;}
.mkt-tools button:active{background:var(--sep);}
.empty{padding:34px 20px;text-align:center;color:var(--label3);font-size:13px;line-height:1.7;}
.pane{display:none;}
.pane.on{display:block;}

/* ---------- 시트 ---------- */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s;}
.dim.on{opacity:1;pointer-events:auto;}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:520px;
  background:var(--card);border-radius:var(--r) var(--r) 0 0;z-index:101;max-height:88vh;overflow-y:auto;
  transition:transform .28s cubic-bezier(.25,.8,.25,1);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px);}
.sheet.on{transform:translateX(-50%) translateY(0);}
.sh-handle{width:36px;height:4px;background:var(--sep2);border-radius:2px;margin:11px auto 4px;}
.sh-hd{padding:10px 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.sh-title{font-size:17px;font-weight:700;letter-spacing:-.3px;}
.sh-body{padding:0 20px;}
.fld{margin-bottom:14px;}
.fld-lab{font-size:12px;font-weight:600;color:var(--label2);margin-bottom:6px;}
.inp{width:100%;border:1px solid var(--sep2);border-radius:var(--rs);padding:11px 12px;background:var(--bg);
  color:var(--label);outline:none;font-size:16px;}
.inp:focus{border-color:var(--blue);background:var(--card);}
textarea.inp{resize:vertical;min-height:92px;line-height:1.55;}
.row2{display:flex;gap:8px;}
.row2>*{flex:1;min-width:0;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{border:1px solid var(--sep2);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:500;
  background:var(--card);color:var(--label2);transition:all .12s;}
.chip.on{background:var(--label);border-color:var(--label);color:#fff;font-weight:600;}
.btn{width:100%;border-radius:var(--rs);padding:13px;font-size:15px;font-weight:600;background:var(--label);color:#fff;margin-top:6px;}
.btn:disabled{opacity:.35;}
.btn.ghost{background:transparent;color:var(--red);border:1px solid var(--sep2);margin-top:8px;font-size:13.5px;padding:11px;}
.mrow{display:flex;align-items:center;gap:12px;padding:13px 20px;width:100%;text-align:left;position:relative;}
.mrow::after{content:'';position:absolute;left:20px;right:20px;bottom:0;height:1px;background:var(--sep);}
.mrow:last-child::after{display:none;}
.mrow.danger{color:var(--red);}
.mrow .mi,.trow .mi{width:22px;text-align:center;font-size:15px;}
.mrow-t{font-size:14.5px;font-weight:500;}
.mrow.on .mrow-t{font-weight:700;color:var(--blue);}
.trow{display:flex;align-items:stretch;position:relative;}
.trow::after{content:'';position:absolute;left:20px;right:20px;bottom:0;height:1px;background:var(--sep);}
.trow:last-child::after{display:none;}
.trow-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:13px 8px 13px 20px;text-align:left;}
.trow.on .mrow-t{font-weight:700;color:var(--blue);}
.trow-edit{display:flex;align-items:center;justify-content:center;padding:0 18px;color:var(--label3);flex-shrink:0;}
.trow-edit:active{color:var(--label);background:var(--fill);}
.sh-div{height:8px;background:var(--bg);}
.hint{font-size:12px;color:var(--label3);line-height:1.55;margin:-6px 0 14px;}
.inp-wrap{position:relative;}
.inp.has-btn{padding-right:82px;}
.inp-search{position:absolute;right:6px;top:6px;bottom:6px;padding:0 11px;border-radius:7px;
  background:var(--blue-bg);color:var(--blue-txt);font-size:12.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:4px;}
.inp-search:active{opacity:.6;}
/* 장소·주소 검색 오버레이 (Daum 우편번호) */
.pc-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:130;display:flex;
  align-items:center;justify-content:center;padding:16px;}
.pc-box{width:100%;max-width:440px;height:72vh;max-height:580px;background:var(--card);
  border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 14px 44px rgba(0,0,0,.32);}
.pc-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 12px 16px;

/* 공용 양념 — 레시피에서 '='(고정 수량, 한 통이면 충분)로 표시된 재료 이름 모음.
   여러 메뉴에 걸쳐도 합산하지 않고 최댓값(사실상 1통)만 필요.
   단, 어느 레시피에선 인원 비례로 쓰이는 이름은 오탐 방지 위해 제외. */
const STAPLES=(()=>{
  const fixed=new Set(), scaled=new Set();
  RECIPES.forEach(r=>String(r[2]).split('|').forEach(p=>{
    const a=p.split(','), n=(a[0]||'').trim(), q=(a[1]||'').trim();
    if(n)(q[0]==='='?fixed:scaled).add(n);
  }));
  scaled.forEach(n=>fixed.delete(n));
  return fixed;
})();

// '=1통' → 고정 수량, '0.3kg' → 인원수 비례
function parseRecipe(str){
  return str.split('|').map(p=>{
    const [rawN,rawQ,rawC]=p.split(',');
    let qs=(rawQ||'1개').trim(), fix=false;
    if(qs[0]==='='){fix=true;qs=qs.slice(1);}
    const m=qs.match(/^([\d.]+)\s*(.*)$/);
    const c=(rawC||'').trim();
    return {n:(rawN||'').trim(), q:m?parseFloat(m[1]):1, u:m?(m[2]||'개'):'개',
      c:MKT_CATS.includes(c)?c:'기타', fix};
  }).filter(x=>x.n);
}
const DECIMAL_UNITS=/^(kg|g|L|ml|컵)$/;
// 1인분 재료 → 인원수만큼 환산 (고정 항목은 그대로)
function scaleIng(ing,people){
  return ing.map(i=>{
    let q=i.fix?i.q:i.q*people;
    q=DECIMAL_UNITS.test(i.u)?Math.round(q*100)/100:Math.ceil(q-1e-9);
    return {n:i.n,q:Math.max(q,DECIMAL_UNITS.test(i.u)?0.01:1),u:i.u,c:i.c};
  });
}

/* 재료 이름 → 분류·단위 사전 (내장 레시피 104종에서 학습, 가장 흔한 값).
   재료 입력에서 이름만 써도 분류·단위를 자동으로 채우는 데 사용 */
const ING_DICT=(()=>{
  const acc={};
  RECIPES.forEach(r=>parseRecipe(r[2]).forEach(i=>{
    const a=acc[i.n]||(acc[i.n]={c:{},u:{}});
    a.c[i.c]=(a.c[i.c]||0)+1; a.u[i.u]=(a.u[i.u]||0)+1;
  }));
  const top=o=>Object.keys(o).sort((x,y)=>o[y]-o[x])[0];
  const d={}; Object.keys(acc).forEach(n=>{d[n]={c:top(acc[n].c),u:top(acc[n].u)};});
  return d;
})();
// 이름으로 분류·단위 힌트: 내장 사전 우선, 없으면 내 사전(과거 입력)에서 학습
function ingHint(n){
  if(ING_DICT[n])return ING_DICT[n];
  for(const r of (DB.library||[])){
    const hit=(r.ing||[]).find(i=>i.n===n);
    if(hit)return {c:MKT_CATS.includes(hit.c)?hit.c:'기타', u:hit.u||'개'};
  }
  return null;
}

/* ---- 레시피 검색: 내 사전 우선, 이름 겹치면 내 사전이 이김 ---- */
function searchRecipes(q){
  const key=String(q||'').trim().toLowerCase();
  if(!key)return [];
  const mine=(DB.library||[]).filter(r=>r.name.toLowerCase().includes(key))
    .map(r=>({name:r.name,emoji:r.emoji,ing:r.ing,gear:r.gear||[],people:r.people||1,mine:true}));
  const taken=new Set(mine.map(r=>r.name));
  const built=RECIPES.filter(r=>r[0].toLowerCase().includes(key)&&!taken.has(r[0]))
    .map(r=>({name:r[0],emoji:r[1],ing:parseRecipe(r[2]),gear:recipeGear(r[0]),people:1,mine:false}));
  return [...mine,...built].slice(0,10);
}
// 내 사전에 저장 (같은 이름이면 덮어씀)
function saveToLibrary(name,emoji,ing,people,gear){
  DB.library=DB.library||[];
  const i=DB.library.findIndex(r=>r.name===name);
  const entry={name,emoji,ing:ing.map(x=>({...x})),gear:(gear||[]).slice(),people,at:Date.now()};
  if(i>=0)DB.library[i]=entry; else DB.library.push(entry);
}
// 이전 버전 데이터 보정: 카테고리 이름 변경, '박수/인원수' → 실제 값
function migrate(db){
  if(!Array.isArray(db.library))db.library=[];   // 내 사전 (여행 간 재사용)
  if(db.packTemplateType==='biz')db.packTemplateType='domestic';   // 출장 유형 폐지 → 국내
  (db.trips||[]).forEach(t=>{
    if(t.type==='biz')t.type='domestic';   // 출장은 여행이 아니라 유형에서 제거
    const n=Math.max(0,diffDays(t.dateStart,t.dateEnd)), p=t.people||1;
    (t.pack||[]).forEach(it=>{
      if(CAT_RENAME[it.cat])it.cat=CAT_RENAME[it.cat];
      if(it.auto==='박수')it.auto=BY_NIGHTS(n,p);
      else if(it.auto==='인원수')it.auto=BY_PEOPLE(n,p);
    });
    (t.menus||[]).forEach(m=>{if(!Array.isArray(m.gear))m.gear=[];});
  });
  return db;
}

// 준비물 수량: '×3' ↔ 3 (1이면 표시하지 않음)
const qtyNum=s=>{const m=String(s==null?'':s).match(/(\d+)/);return m?Math.max(1,parseInt(m[1],10)):1;};
const qtyStr=n=>n>1?'×'+n:'';

function nightsOf(t){return Math.max(0,diffDays(t.dateStart,t.dateEnd));}
function daysOf(t){return nightsOf(t)+1;}

// 이름 → 수량 규칙 / 유형 제한 (내 기본 준비물에서도 상의 ×박수, 여권=해외 전용 등 유지용)
const NAME_RULE={}, NAME_ONLY={};
PACK_TPL.forEach(g=>g.items.forEach(it=>{
  if(it.q)NAME_RULE[it.n]={q:it.q,s:it.s};
  if(it.only)NAME_ONLY[it.n]=it.only;
}));

function genPack(t){
  const n=nightsOf(t),p=t.people||1;
  const mk=(cat,name)=>{const r=NAME_RULE[name];
    return {id:uid(),cat,name,qty:r?r.q(n,p):'',auto:r&&r.s?r.s(n,p):'',done:false};};
  // 내 기본 준비물이 저장돼 있으면 그걸 사용
  const tpl=DB.packTemplate;
  if(Array.isArray(tpl)&&tpl.length){
    const tplType=DB.packTemplateType||'domestic';
    // 이 유형에 안 맞는 항목 제외 (예: 국내 템플릿의 자동차키를 해외 여행에서)
    const list=tpl.filter(it=>{const o=NAME_ONLY[it.name];return !o||o.includes(t.type);})
      .map(it=>mk(it.cat,it.name));
    // 템플릿 저장 당시 유형엔 없어서 지울 기회도 없던 유형 전용 항목(여권 등) 보충
    PACK_TPL.forEach(g=>g.items.forEach(it=>{
      if(!it.only||!it.only.includes(t.type)||it.only.includes(tplType))return;
      if(!list.some(x=>x.name===it.n))list.push(mk(g.cat,it.n));
    }));
    return list;
  }
  const out=[];
  PACK_TPL.forEach(g=>g.items.forEach(it=>{
    if(it.only&&!it.only.includes(t.type))return;
    out.push(mk(g.cat,it.n));
  }));
  return out;
}
// 현재 여행의 준비물을 내 기본값으로 저장 (아이스박스·조리도구는 메뉴에서 자동 연동되므로 제외)
function savePackTemplate(t){
  DB.packTemplate=(t.pack||[])
    .filter(pi=>pi.cat!=='아이스박스'&&pi.cat!=='조리도구')
    .map(pi=>({cat:pi.cat,name:pi.name}));
  DB.packTemplateType=t.type||'domestic';
}

function newTrip(f){
  const t={id:uid(),name:f.name,stay:f.stay||'',type:f.type||'domestic',
    dateStart:f.dateStart,dateEnd:f.dateEnd,people:f.people||1,
    pack:[],menus:[],bought:[],extras:[],plans:[],createdAt:Date.now()};
  t.pack=genPack(t);
  t.menus=SEED_MENUS.map(m=>{
    const gear=recipeGear(m.name), ing=m.ing.map(i=>({...i}));
    if(gearNeedsGas(gear)&&!ing.some(i=>i.n==='부탄가스'))ing.push({n:'부탄가스',q:1,u:'개',c:'기타'});
    return {id:uid(),name:m.name,emoji:m.emoji,day:null,picked:false,ing,gear};
  });
  return t;
}
// 선택된 메뉴들의 조리도구를 준비물 '조리도구'로 연동 (중복은 하나만). 변경 시 true
function syncGear(t){
  const cat='조리도구', need=new Set();
  (t.menus||[]).filter(m=>m.picked).forEach(m=>(m.gear||[]).forEach(g=>need.add(g)));
  let changed=false;
  const before=t.pack.length;
  t.pack=t.pack.filter(p=>!(p.cat===cat&&p.gearAuto&&!p.done&&!need.has(p.name)));
  if(t.pack.length!==before)changed=true;
  need.forEach(name=>{
    if(!t.pack.some(p=>p.cat===cat&&p.name===name)){
      t.pack.push({id:uid(),cat,name,qty:'',auto:'',gearAuto:true,done:false});changed=true;
    }
  });
  return changed;
}

/* ---- 장보기 합산 ---- */
function mergeMarket(t){
  const map=new Map();
  // 공용 양념(STAPLES)은 최댓값(1통이면 충분), 나머지는 합산
  const add=(n,u,c,q,fromName,manual)=>{
    const key=n+'|'+(u||'');
    if(!map.has(key))map.set(key,{key,n,u:u||'',c:c||'기타',q:0,from:[],staple:STAPLES.has(n),manual:false});
    const e=map.get(key), val=Number(q)||0;
    e.q=e.staple?Math.max(e.q,val):e.q+val;
    if(manual)e.manual=true;
    if(fromName&&!e.from.includes(fromName))e.from.push(fromName);
  };
  (t.menus||[]).filter(m=>m.picked).forEach(m=>(m.ing||[]).forEach(i=>add(i.n,i.u,i.c,i.q,m.name,false)));
  (t.extras||[]).forEach(x=>add(x.n,x.u,x.c,x.q,null,true));
  // 사용자가 직접 고친 값 덮어쓰기 · 뺀 항목 제외
  const ov=t.overrides||{}, ex=new Set(t.excluded||[]);
  return [...map.values()].filter(i=>!ex.has(i.key)).map(i=>{
    const o=ov[i.key];
    if(o){ if(o.q!=null)i.q=o.q; if(o.u)i.u=o.u; if(o.c)i.c=o.c; i.edited=true; }
    return i;
  });
}
function hasCold(t){return mergeMarket(t).some(i=>COLD[i.c]);}

function syncIcebox(t){
  const need=hasCold(t);
  const has=t.pack.some(p=>p.cat==='아이스박스');
  if(need&&!has){
    ICEBOX_ITEMS.forEach(it=>t.pack.push({id:uid(),cat:'아이스박스',name:it.n,
      qty:it.q?it.q():'',auto:'냉장 재료 있음',done:false}));
    return true;
  }
  if(!need&&has){
    const onlyAuto=t.pack.filter(p=>p.cat==='아이스박스').every(p=>p.auto==='냉장 재료 있음'&&!p.done);
    if(onlyAuto){t.pack=t.pack.filter(p=>p.cat!=='아이스박스');return true;}
  }
  return false;
}

/* ---- 오늘 ---- */
function viewToday(t){
  const D=daysOf(t), today=todayStr();
  let cur=diffDays(t.dateStart,today);
  if(cur<0)cur=0; if(cur>D-1)cur=D-1;
  if(UI.day==null||UI.day<0||UI.day>D-1)UI.day=cur;
  const dayDate=addDays(t.dateStart,UI.day);

  const packDone=t.pack.filter(p=>p.done).length, packAll=t.pack.length;
  const mkt=mergeMarket(t), bought=new Set(t.bought||[]);
  const mktLeft=mkt.filter(i=>!bought.has(i.key)).length;

  const dd=diffDays(today,t.dateStart);
  let heroLab,heroBig;
  if(dd>0){heroLab='출발까지';heroBig=dd+'일 남음';}
  else if(dd===0){heroLab='오늘 출발';heroBig='D-DAY';}
  else if(diffDays(today,t.dateEnd)>=0){heroLab='여행 중';heroBig='Day '+(1-dd);}
  else {heroLab='여행 종료';heroBig=fmtMD(t.dateEnd)+' 마무리';}

  const cold=mkt.filter(i=>COLD[i.c]&&!bought.has(i.key));
  const coldBanner=(dd>=0&&cold.length)?`
    <div class="banner"><div class="bi">🧊</div><div>
      <div class="banner-t">콜드체인 · ${cold.length}개 항목</div>
      <div class="banner-d">${cold.slice(0,4).map(i=>esc(i.n)).join(' · ')}${cold.length>4?' 외':''}는 아이스박스에 넣어야 합니다.</div>
    </div></div>`:'';

  const chips=Array.from({length:D},(_,i)=>{
    const ds=addDays(t.dateStart,i);
    return `<button class="dchip ${UI.day===i?'on':''}" data-day="${i}">Day ${i+1}<small>${fmtMD(ds)}</small></button>`;
  }).join('');

  const plans=(t.plans||[]).filter(p=>p.day===UI.day)
    .sort((a,b)=>String(a.time||'').localeCompare(String(b.time||'')));
  const nowIdx=(diffDays(t.dateStart,today)===UI.day)?nearestPlan(plans):-1;
  const tl=plans.length?`<div class="tl">${plans.map((p,i)=>`
    <div class="tl-item ${i===nowIdx?'now':(nowIdx>=0&&i<nowIdx?'past':'')}" data-plan="${p.id}">
      <div class="tl-dot"></div>
      <button class="grow tap" data-editplan="${p.id}"><div class="tl-time">${esc((p.time||'시간 미정')+(p.end?' – '+p.end:''))}${i===nowIdx?' · 지금':''}</div>
        <div class="tl-title">${esc(p.title||p.note||'(제목 없음)')}</div>
        ${p.title&&p.note?`<div class="tiny">${esc(p.note)}</div>`:''}</button>
      <button class="del-x" data-delplan="${p.id}">${XICO}</button>
    </div>`).join('')}</div>`
    :`<div class="empty">이 날의 일정이 없습니다.</div>`;

  const dayMenus=(t.menus||[]).filter(m=>m.day===UI.day);
  const menuRows=dayMenus.length?dayMenus.map(m=>`
    <div class="row" data-openmenu="${m.id}">
      <div class="acc-ic">${esc(m.emoji||'🍽')}</div>
      <div class="grow"><div class="txt" style="font-weight:600">${esc(m.name)}</div>
        <div class="tiny">${(m.ing||[]).map(i=>esc(i.n)).join(' · ')||'재료 없음'}</div></div>
      ${(m.ing||[]).some(i=>COLD[i.c])?'<span class="pill-tag tag-cold">냉장</span>':''}
    </div>`).join('')
    :`<div class="empty">이 날에 지정된 메뉴가 없습니다.<br>장보기 탭에서 메뉴에 날짜를 지정하세요.</div>`;

  return `
  ${coldBanner}
  <div class="hero">
    <div class="hero-lab">${heroLab}</div>
    <div class="hero-big">${heroBig}</div>
    <div class="hero-sub">준비물 <b>${packDone}/${packAll}</b> · 장볼 것 <b>${mktLeft}개</b> 남음</div>
  </div>
  <div class="dayseg">${chips}</div>
  <div class="sec">
    <div class="sec-hd"><div class="sec-title">일정 · ${fmtFull(dayDate)}</div>
      <div class="sec-note">Day ${UI.day+1}</div></div>
    ${tl}
    <button class="addbtn" id="btnAddPlan"><span class="plus">+</span> 일정 추가</button>
  </div>
  ${quickCheckCard(t,UI.day,D)}
  <div class="sec">
    <div class="sec-hd"><div class="sec-title">이 날 메뉴</div>
      <div class="sec-note">${dayMenus.length}개</div></div>
    ${menuRows}
  </div>`;
}
/* 출발일(Day 1)엔 집 체크, 마지막 날엔 귀가 체크 카드 */
function quickCheckCard(t,day,D){
  const cards=[];
  t.chk=t.chk||{dep:[],ret:[]};
  const build=(kind,icon,title,items)=>{
    const on=t.chk[kind]||[];
    const dn=items.filter(x=>on.includes(x)).length;
    return `<div class="sec">
      <div class="sec-hd"><div class="sec-title">${icon} ${title}</div>
        <div class="sec-note ${dn===items.length?'src':''}">${dn}/${items.length}</div></div>
      ${items.map(x=>`<div class="row ${on.includes(x)?'done':''}">
        <button class="cb ${on.includes(x)?'on':''}" data-chk="${kind}|${esc(x)}">${CHECK}</button>
        <div class="grow"><div class="txt">${esc(x)}</div></div>
      </div>`).join('')}
    </div>`;
  };
  if(day===0)cards.push(build('dep','🏠','출발 전 · 집 체크',DEP_CHECK));
  if(day===D-1)cards.push(build('ret',`<img src="${CARRIER_ICON}" alt="" style="height:17px;width:17px;object-fit:contain;vertical-align:-3px">`,'떠나기 전 · 숙소 체크',RET_CHECK));
  return cards.join('');
}

function nearestPlan(plans){
  const now=new Date(),hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  let idx=-1; plans.forEach((p,i)=>{if(p.time&&p.time<=hm)idx=i;});
  return idx>=0?idx:(plans.length?0:-1);
}

// 카테고리 표시 순서: DB.catOrder(전역 설정) 우선, 나머지는 기본 순서
function orderedPackCats(){
  const ord=DB.catOrder||[];
  return PACK_CATS.slice().sort((a,b)=>{
    const ia=ord.indexOf(a.cat), ib=ord.indexOf(b.cat);
    return (ia<0?PACK_CATS.findIndex(x=>x.cat===a.cat)+100:ia)
         - (ib<0?PACK_CATS.findIndex(x=>x.cat===b.cat)+100:ib);
  });
}

const ARR='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 4v16"/><path d="M8 8l4-4 4 4"/><path d="M8 16l4 4 4-4"/></svg>';

function viewPack(t){
  const done=t.pack.filter(p=>p.done).length,all=t.pack.length;
  const pct=all?Math.round(done/all*100):0;
  const cats=orderedPackCats().filter(c=>t.pack.some(p=>p.cat===c.cat));
  const typeName=(TYPES.find(x=>x.k===t.type)||{}).n||'';
  const sort=!!UI.packSort;

  const accs=cats.map((c,ci)=>{
    const items=t.pack.filter(p=>p.cat===c.cat);
    const dn=items.filter(p=>p.done).length;
    const open=!!UI.openCats[c.cat];   // 정렬 모드도 접힌 채 시작, 탭해서 열고 항목 정렬
    const hdTag=sort?'div':'button';   // button 안에 다른 버튼 중첩 시 DOM이 깨짐
    return `<div class="acc ${open?'open':''}" ${sort?`data-sortcat="${esc(c.cat)}"`:''}>
      <${hdTag} class="acc-hd" data-cat="${esc(c.cat)}">
        <span class="acc-ic">${c.ic}</span>
        <span class="acc-name">${esc(c.cat)}</span>
        ${sort?`<span class="acc-count">${items.length}</span>${CHEV}
            <span class="drag-h" data-kind="cat">${HANDLE}</span>`
          :`<span class="acc-count ${dn===items.length?'full':''}">${dn}/${items.length}</span>${CHEV}`}
      </${hdTag}>
      <div class="acc-body">
        ${items.map(p=>`<div class="row ${p.done?'done':''}" ${sort?`data-rowid="${p.id}" data-rowcat="${esc(p.cat)}"`:''}>
          ${sort?`<div class="grow"><div class="txt">${esc(p.name)}</div></div>
            <span class="drag-h" data-kind="item">${HANDLE}</span>
            <button class="del-x" data-delpack="${p.id}">${XICO}</button>`
          :`<button class="cb ${p.done?'on':''}" data-pack="${p.id}">${CHECK}</button>
          <button class="grow tap" data-editpack="${p.id}"><div class="txt">${esc(p.name)}</div></button>
          ${qtyNum(p.qty)>1?`<div class="qty">×${qtyNum(p.qty)}</div>`:''}
          <button class="del-x" data-delpack="${p.id}">${XICO}</button>`}
        </div>`).join('')}
        ${sort?'':`<button class="addbtn" data-addpack="${esc(c.cat)}"><span class="plus">+</span> 항목 추가</button>`}
      </div></div>`;
  }).join('');

  return `
  <div class="prog-wrap">
    <div class="prog-top"><div class="prog-lab">짐 싸기</div>
      <div class="prog-num">${done} / ${all}</div></div>
    <div class="bar"><i class="${pct===100?'full':''}" style="width:${pct}%"></i></div>
  </div>
  ${sort?`<div class="banner b"><div class="bi">↕️</div><div>
    <div class="banner-t">순서 바꾸기</div>
    <div class="banner-d">≡ 를 누른 채 끌면 카드가 따라 움직입니다. 카테고리를 탭해 열면 안의 항목도 옮길 수 있습니다.</div>
  </div></div>`
  :`<div class="banner g"><div class="bi">✨</div><div>
    <div class="banner-t">${DB.packTemplate?'내 기본 준비물 사용 중':esc(typeName)+' · '+nightsOf(t)+'박'+daysOf(t)+'일 · '+t.people+'명 기준'}</div>
    <div class="banner-d">${DB.packTemplate
      ?'직접 저장한 기본 목록으로 만들어졌습니다. 상의·칫솔 등 수량은 이번 여행에 맞춰 계산됩니다.'
      :'상의·속옷은 여행 길이, 칫솔·수건은 인원수에 맞춰 수량이 계산됐습니다. 필요 없는 항목은 지우면 됩니다.'}</div>
  </div></div>`}
  <div class="mkt-tools"><button id="btnPackSort">${sort?'✓ 순서 편집 완료':`<span style="display:inline-flex;align-items:center;gap:4px">${ARR}순서 바꾸기</span>`}</button></div>
  <div class="sec">${accs||'<div class="empty">항목이 없습니다.</div>'}</div>
  ${sort?'':`
  <button class="addbtn" data-addpack="기타" style="background:var(--card);border-radius:var(--r)">
    <span class="plus">+</span> 새 항목 추가</button>
  <div class="pack-tpl">
    <button id="btnSavePackTpl">📌 이 준비물을 다음 여행 기본값으로 저장</button>
    ${DB.packTemplate?`<button id="btnResetPackTpl" class="reset">기본값을 앱 기본으로 되돌리기</button>`:''}
  </div>`}`;
}

/* ---- 장보기 ---- */
let lastMerged=new Set();
// 매대(장보기 카테고리) 표시 순서: DB.mktOrder(전역 설정) 우선, 나머지는 기본 순서
function orderedMktCats(){
  const ord=DB.mktOrder||[];
  return MKT_CATS.slice().sort((a,b)=>
    (ord.indexOf(a)<0?MKT_CATS.indexOf(a)+100:ord.indexOf(a))
   -(ord.indexOf(b)<0?MKT_CATS.indexOf(b)+100:ord.indexOf(b)));
}
// 장볼 것 항목 표시 순서: t.buyOrder(키 목록) 우선, 없으면 기본(합산) 순서 유지
function buyRank(t){const ord=t.buyOrder||[];return (a,b)=>{
  const ia=ord.indexOf(a.key), ib=ord.indexOf(b.key);
  return (ia<0?1e9:ia)-(ib<0?1e9:ib);};}
function viewMarket(t){
  const menus=t.menus||[];
  const items=mergeMarket(t), bought=new Set(t.bought||[]);
  const done=items.filter(i=>bought.has(i.key)).length, all=items.length;
  const pct=all?Math.round(done/all*100):0;
  const left=all-done;
  const nowMerged=new Set(items.filter(i=>i.from.length>1).map(i=>i.key));

  // 메뉴 = 행 리스트: 왼쪽 동그라미로 담기, 이름을 눌러 '필요한 것' 묶음 보기
  const menuRow=m=>{
    const cold=(m.ing||[]).some(i=>COLD[i.c]);
    const prev=(m.ing||[]).map(i=>esc(i.n)).join(' · ')||'재료 없음';
    return `<div class="row ${m.picked?'':'menu-off'}">
      <button class="cb ${m.picked?'on':''}" data-menu="${m.id}">${CHECK}</button>
      <button class="grow tap" data-menubundle="${m.id}">
        <div class="txt" style="font-weight:600">${esc(m.emoji||'🍽')} ${esc(m.name)}</div>
        <div class="tiny">${prev}</div></button>
      ${cold?'<span class="pill-tag tag-cold">냉장</span>':''}
      ${CHEV}</div>`;
  };
  // A: 담은 메뉴를 위로 · B: 담은 게 있으면 안 담은 메뉴는 접어서 '더 보기'
  const pickedMenus=menus.filter(m=>m.picked), restMenus=menus.filter(m=>!m.picked);
  let menuListHtml;
  if(!menus.length){
    menuListHtml='<div class="empty">메뉴가 없습니다.</div>';
  }else if(!pickedMenus.length){
    // 아직 담은 게 없으면 전부 펼쳐 첫 선택을 돕는다
    menuListHtml=restMenus.map(menuRow).join('');
  }else{
    const open=UI.menuMoreOpen;
    const more=restMenus.length?`
      <button class="menu-more ${open?'open':''}" id="menuMoreToggle">
        <span class="mm-lab">${open?'담을 메뉴 접기':'담을 메뉴 더 보기'}</span>
        <span class="mm-cnt">${restMenus.length}</span>${CHEV}</button>
      ${open?`<div class="menu-more-body">${restMenus.map(menuRow).join('')}</div>`:''}`:'';
    menuListHtml=pickedMenus.map(menuRow).join('')+more;
  }

  const sort=!!UI.mktSort;
  const cats=orderedMktCats().filter(c=>items.some(i=>i.c===c));
  const allOpen=cats.every(c=>!UI.mktClosed[c]);
  const buildRow=(i,cat)=>{
    if(sort)return `<div class="row" data-rowid="${esc(i.key)}" data-rowcat="${esc(cat)}">
      <div class="grow"><div class="txt">${esc(i.n)}</div></div>
      <span class="drag-h" data-kind="item">${HANDLE}</span>
      <button class="del-x" data-delbuy="${esc(i.key)}">${XICO}</button></div>`;
    const on=bought.has(i.key), multi=i.from.length>1;
    const shared=i.staple&&multi;   // 공용 양념이 여러 메뉴에 걸침 → 합산이 아니라 '공용'
    const isNew=multi&&!lastMerged.has(i.key);
    const q=Number.isInteger(i.q)?i.q:Number(i.q.toFixed(2));
    let srcTxt=i.manual&&!i.from.length?'직접 추가':i.from.join(' · ');
    if(i.edited)srcTxt=(srcTxt?srcTxt+' · ':'')+'직접 수정함';
    const showSrc=multi||(srcTxt&&srcTxt!==i.n);
    return `<div class="row ${on?'done':''} ${isNew?'flash':''}">
      <button class="cb ${on?'on':''}" data-buy="${esc(i.key)}">${CHECK}</button>
      <button class="grow tap" data-editbuy="${esc(i.key)}"><div class="txt">${esc(i.n)}</div>
        ${showSrc?`<div class="tiny ${multi?'src':''}">${shared?'공용 · ':(multi?'합산 · ':'')}${esc(srcTxt)}</div>`:''}</button>
      ${COLD[cat]?'<span class="pill-tag tag-cold">콜드</span>':''}
      <div class="qty">${q}${esc(i.u)}</div>
      <button class="del-x" data-delbuy="${esc(i.key)}">${XICO}</button>
    </div>`;
  };
  const accs=cats.map(cat=>{
    const catItems=items.filter(i=>i.c===cat).sort(buyRank(t));
    const dn=catItems.filter(i=>bought.has(i.key)).length;
    const open=!UI.mktClosed[cat];
    const hdTag=sort?'div':'button';   // button 안에 다른 버튼 중첩 방지
    return `<div class="acc ${open?'open':''}" ${sort?`data-sortcat="${esc(cat)}"`:''}>
      <${hdTag} class="acc-hd" data-mktcat="${esc(cat)}">
        <span class="acc-ic">${MKT_IC[cat]}</span>
        <span class="acc-name">${esc(cat)}</span>
        ${sort?`<span class="acc-count">${catItems.length}</span>${CHEV}
            <span class="drag-h" data-kind="cat">${HANDLE}</span>`
          :`<span class="acc-count ${dn===catItems.length?'full':''}">${dn}/${catItems.length}</span>${CHEV}`}
      </${hdTag}>
      <div class="acc-body">${catItems.map(i=>buildRow(i,cat)).join('')}</div></div>`;
  }).join('');
  const listHtml=all?`
    ${sort?`<div class="banner b"><div class="bi">↕️</div><div>
      <div class="banner-t">순서 바꾸기</div>
      <div class="banner-d">≡ 를 누른 채 끌면 매대가 따라 움직입니다. 매대를 탭해 열면 안의 재료도 옮길 수 있습니다.</div>
    </div></div>`:''}
    <div class="mkt-tools">
      ${sort?'':`<button id="mktToggleAll">${allOpen?'전체 접기':'전체 펼치기'}</button>`}
      <button id="btnMktSort">${sort?'✓ 순서 편집 완료':`<span style="display:inline-flex;align-items:center;gap:4px">${ARR}순서 바꾸기</span>`}</button></div>
    <div class="sec">${accs}</div>`
  :`<div class="sec"><div class="empty">고른 메뉴가 없습니다.<br>‘메뉴 고르기’에서 먼저 선택해 주세요.</div></div>`;

  lastMerged=nowMerged;

  return `
  <div class="seg">
    <button class="${UI.seg==='menu'?'on':''}" data-seg="menu">메뉴 고르기</button>
    <button class="${UI.seg==='list'?'on':''}" data-seg="list">장볼 것${all?' '+left:''}</button>
  </div>
  <div style="display:${UI.seg==='menu'?'block':'none'}">
    <div class="sec">
      <div class="sec-hd"><div class="sec-title">메뉴</div><div class="sec-note">${pickedMenus.length?`담은 메뉴 ${pickedMenus.length}개`:'○ 담기 · 눌러서 필요한 것 보기'}</div></div>
      ${menuListHtml}
      <button class="addbtn" id="btnAddMenu"><span class="plus">+</span> 메뉴 추가</button>
      ${DB.trips.some(x=>x.id!==t.id&&(x.menus||[]).length)?
        `<button class="addbtn" id="btnImportMenus" style="border-top:1px solid var(--sep)">
          <span class="plus">↓</span> 지난 여행에서 메뉴 가져오기</button>`:''}
    </div>
    <div class="banner b"><div class="bi">🛒</div><div>
      <div class="banner-t">고른 메뉴의 재료가 자동으로 합쳐집니다</div>
      <div class="banner-d">같은 재료는 수량이 더해지고, 어느 메뉴에서 왔는지 함께 표시됩니다.</div>
    </div></div>
  </div>
  <div style="display:${UI.seg==='list'?'block':'none'}">
    <div class="prog-wrap">
      <div class="prog-top"><div class="prog-lab">통합 장보기</div>
        <div class="prog-num">${done} / ${all}</div></div>
      <div class="bar"><i class="${all&&pct===100?'full':''}" style="width:${pct}%"></i></div>
    </div>
    ${listHtml}
    ${sort?'':`<button class="addbtn" id="btnAddExtra" style="background:var(--card);border-radius:var(--r)">
      <span class="plus">+</span> 직접 항목 추가</button>`}
  </div>`;
}

/* ================= 시트 ================= */
// 시트가 하나라도 열려 있으면 토스트를 화면 위로 (하단 버튼과 겹침 방지)
function positionToast(){
  const up=$('#sheet').classList.contains('on')||$('#sheet2').classList.contains('on');
  document.querySelector('.toast-wrap').classList.toggle('up',up);
}

function openSheet(html){
  const sh=$('#sheet');
  sh.innerHTML='<div class="sh-handle"></div>'+html;
  sh.classList.add('on');$('#dim').classList.add('on');positionToast();
  // 엔터로 기본 버튼 실행 (자동완성이 열려 있으면 첫 후보 선택)
  const primary=sh.querySelector('.btn:not(.ghost)');
  sh.querySelectorAll('input.inp').forEach(inp=>{
    if(inp.type==='date'||inp.type==='time')return;
    inp.addEventListener('keydown',e=>{
      if(e.key!=='Enter')return;
      e.preventDefault();
      const pick=sh.querySelector('.sug.on .sug-row');
      if(pick){pick.click();return;}
      if(primary)primary.click();
    });
  });
  requestAnimationFrame(fitSheetToKeyboard);
}
function closeSheet(){
  const sh=$('#sheet');
  sh.classList.remove('on');$('#dim').classList.remove('on');
  sh.style.bottom='';sh.style.maxHeight='';positionToast();
}
$('#dim').onclick=closeSheet;

/* ---------- 장소·주소 검색 (차용증 앱과 동일한 Daum 우편번호) ---------- */
let _daumP=null;
function loadDaum(){
  if(window.daum&&window.daum.Postcode)return Promise.resolve();
  if(_daumP)return _daumP;
  _daumP=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js';
    s.onload=res; s.onerror=()=>{_daumP=null;rej();};
    document.head.appendChild(s);
  });
  return _daumP;
}
function openPlaceSearch(onPick){
  loadDaum().then(()=>{
    const ov=document.createElement('div');
    ov.className='pc-overlay';
    ov.innerHTML=`<div class="pc-box">
      <div class="pc-hd"><div class="pc-hd-t">장소 · 주소 검색</div>
        <button class="icon-btn" id="pc-x">${XICO}</button></div>
      <div class="pc-embed" id="pc-embed"></div></div>`;
    document.body.appendChild(ov);
    const close=()=>ov.remove();
    ov.querySelector('#pc-x').onclick=close;
    ov.addEventListener('click',e=>{if(e.target===ov)close();});
    new daum.Postcode({
      oncomplete(d){
        const name=(d.buildingName&&d.buildingName.trim())?d.buildingName:(d.roadAddress||d.address);
        onPick({name,address:d.roadAddress||d.address});
        close();
      },
      width:'100%',height:'100%'
    }).embed(ov.querySelector('#pc-embed'));
  }).catch(()=>toast('장소 검색을 불러오지 못했습니다 · 직접 입력해 주세요'));
}

/* ---------- 날짜·시간 피커 (시트 위에 겹치는 두 번째 레이어) ---------- */
let PK=null;   // {date,time,min,max,withTime,onDone,cur:{y,m},wheelH,wheelM}
let pkProg=false;   // 휠 스크롤을 코드로 조정하는 동안 scroll 이벤트 무시

function openPicker(o){
  const base=parseD(o.date)||new Date();
  const t0=o.time||'';
  PK={date:o.date||'', time:t0, min:o.min||'', max:o.max||'',
      withTime:!!o.withTime, timeOnly:!!o.timeOnly,
      title:o.title||'날짜 선택', onDone:o.onDone,
      cur:{y:base.getFullYear(),m:base.getMonth()},
      wheelH:t0?+t0.slice(0,2):9, wheelM:t0?+t0.slice(3,5):0};
  renderPicker();
  $('#sheet2').classList.add('on'); $('#dim2').classList.add('on'); positionToast();
}
function closePicker(){PK=null;$('#sheet2').classList.remove('on');$('#dim2').classList.remove('on');positionToast();}
$('#dim2').onclick=closePicker;

function renderPicker(){
  const {y,m}=PK.cur, today=todayStr();
  const startDow=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
  const pad=n=>String(n).padStart(2,'0');
  let cells='';
  for(let i=0;i<startDow;i++)cells+='<div class="cal-c"></div>';
  for(let d=1;d<=days;d++){
    const ds=`${y}-${pad(m+1)}-${pad(d)}`;
    const dis=(PK.min&&ds<PK.min)||(PK.max&&ds>PK.max);
    const dow=new Date(y,m,d).getDay();
    cells+=`<button class="cal-c cal-d ${ds===PK.date?'on':''} ${dis?'dis':''}
      ${dow===0?'sun':''} ${dow===6?'sat':''} ${ds===today?'today':''}"
      ${dis?'disabled':''} data-d="${ds}">${d}</button>`;
  }
  // 앞뒤 달 이동 가능 여부
  const prevLast=`${y}-${pad(m)}-31`, nextFirst=`${m===11?y+1:y}-${pad(m===11?1:m+2)}-01`;
  const noPrev=PK.min&&prevLast<PK.min, noNext=PK.max&&nextFirst>PK.max;

  const hasT=!!PK.time;
  const wItems=(len,unit,sel)=>Array.from({length:len},(_,v)=>
    `<div class="wheel-i ${v===sel?'sel':''}" data-v="${v}">${v}${unit}</div>`).join('');
  const timeHtml=PK.withTime?`
    <div class="pk-sec">
      <div class="prog-top"><div class="fld-lab" style="margin:0">시간</div>
        <div class="pk-now" id="pk-now">${PK.time||'시간 미정'}</div></div>
      <div class="time-in">
        <input class="tin" id="pk-hh" inputmode="numeric" maxlength="2" placeholder="--" value="${hasT?pad(PK.wheelH):''}">
        <span class="tcolon">:</span>
        <input class="tin" id="pk-mm" inputmode="numeric" maxlength="2" placeholder="--" value="${hasT?pad(PK.wheelM):''}">
        <button class="tundo ${hasT?'':'on'}" id="pk-clear">미정</button>
      </div>
      <div class="wheels">
        <div class="wheel" id="wheel-h" data-unit="h">${wItems(24,'시',PK.wheelH)}</div>
        <div class="wheel" id="wheel-m" data-unit="m">${wItems(60,'분',PK.wheelM)}</div>
        <div class="wheel-band"></div>
      </div>
    </div>`:'';

  const calHtml=PK.timeOnly?'':`
      <div class="cal-hd">
        <button class="cal-nav" id="pk-prev" ${noPrev?'disabled':''}>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
        <div class="cal-title">${y}년 ${m+1}월</div>
        <button class="cal-nav" id="pk-next" ${noNext?'disabled':''}>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
      </div>
      <div class="cal-dow">${['일','월','화','수','목','금','토']
        .map((d,i)=>`<span style="${i===0?'color:#E5484D':i===6?'color:#3E63DD':''}">${d}</span>`).join('')}</div>
      <div class="cal-grid" id="pk-grid">${cells}</div>`;

  $('#sheet2').innerHTML=`
    <div class="sh-handle"></div>
    <div class="sh-hd"><div class="sh-title">${esc(PK.title)}</div>
      <button class="icon-btn" id="pk-x">${XICO}</button></div>
    <div class="sh-body">
      ${calHtml}
      ${timeHtml}
      <button class="btn" id="pk-done" ${(PK.timeOnly||PK.date)?'':'disabled'}>확인</button>
    </div>`;

  $('#pk-x').onclick=closePicker;
  if(!PK.timeOnly){
    $('#pk-prev').onclick=()=>{PK.cur.m--;if(PK.cur.m<0){PK.cur.m=11;PK.cur.y--;}renderPicker();};
    $('#pk-next').onclick=()=>{PK.cur.m++;if(PK.cur.m>11){PK.cur.m=0;PK.cur.y++;}renderPicker();};
    $('#pk-grid').onclick=ev=>{const b=ev.target.closest('[data-d]');if(!b)return;
      PK.date=b.dataset.d;renderPicker();};
  }
  if(PK.withTime){
    const ITEM=40, wh=$('#wheel-h'), wm=$('#wheel-m');
    const setSel=(el,idx)=>el.querySelectorAll('.wheel-i').forEach((it,i)=>it.classList.toggle('sel',i===idx));
    const commit=()=>{
      PK.time=pad(PK.wheelH)+':'+pad(PK.wheelM);
      $('#pk-now').textContent=PK.time;
      $('#pk-hh').value=pad(PK.wheelH); $('#pk-mm').value=pad(PK.wheelM);
      $('#pk-clear').classList.remove('on');
    };
    // 초기 스크롤 위치 (코드 조정 중 scroll 이벤트 무시)
    pkProg=true; wh.scrollTop=PK.wheelH*ITEM; wm.scrollTop=PK.wheelM*ITEM;
    setTimeout(()=>{pkProg=false;},70);
    const onScroll=(el,unit)=>{
      if(pkProg)return;
      clearTimeout(el._t);
      el._t=setTimeout(()=>{
        let idx=Math.round(el.scrollTop/ITEM);
        idx=Math.max(0,Math.min(unit==='h'?23:59,idx));
        setSel(el,idx);
        if(unit==='h')PK.wheelH=idx; else PK.wheelM=idx;
        commit();
      },80);
    };
    wh.addEventListener('scroll',()=>onScroll(wh,'h'));
    wm.addEventListener('scroll',()=>onScroll(wm,'m'));
    const typeTo=(inp,el,max,setv)=>{
      let v=parseInt(inp.value.replace(/\D/g,''),10);
      if(isNaN(v))return; v=Math.max(0,Math.min(max,v)); setv(v);
      pkProg=true; el.scrollTop=v*ITEM; setSel(el,v); setTimeout(()=>{pkProg=false;},70);
      commit();
    };
    $('#pk-hh').addEventListener('input',()=>typeTo($('#pk-hh'),wh,23,v=>PK.wheelH=v));
    $('#pk-mm').addEventListener('input',()=>typeTo($('#pk-mm'),wm,59,v=>PK.wheelM=v));
    $('#pk-clear').onclick=()=>{PK.time='';$('#pk-now').textContent='시간 미정';
      $('#pk-hh').value='';$('#pk-mm').value='';$('#pk-clear').classList.add('on');};
  }
  $('#pk-done').onclick=()=>{
    if(!PK.timeOnly&&!PK.date){toast('날짜를 선택해 주세요');return;}
    const {date,time,onDone}=PK; closePicker(); onDone&&onDone(date,time);
  };
}

// 모바일 키보드가 올라와도 시트 버튼이 가려지지 않게
function fitSheetToKeyboard(){
  const vv=window.visualViewport, sh=$('#sheet');
  if(!vv)return;
  if(!sh.classList.contains('on')){sh.style.bottom='';sh.style.maxHeight='';return;}
  const kb=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);
  sh.style.bottom=kb+'px';
  sh.style.maxHeight=Math.max(240,vv.height-24)+'px';
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',fitSheetToKeyboard);
  window.visualViewport.addEventListener('scroll',fitSheetToKeyboard);
}

function sheetTrips(){
  const rows=DB.trips.slice().sort((a,b)=>String(b.dateStart).localeCompare(String(a.dateStart)))
    .map(t=>{
      const n=nightsOf(t);
      return `<div class="trow ${t.id===DB.cur?'on':''}">
        <button class="trow-main" data-switch="${t.id}">
          <span class="mi">${t.id===DB.cur?'📍':'🗓'}</span>
          <span class="grow"><span class="mrow-t">${esc(t.name)}</span>
            <div class="tiny">${fmtMD(t.dateStart)} – ${fmtMD(t.dateEnd)} · ${n}박${n+1}일 · ${t.people}명</div></span>
        </button>
        <button class="trow-edit" data-edittrip="${t.id}" aria-label="여행 정보 수정">${PENCIL}</button>
      </div>`;}).join('');
  openSheet(`
    <div class="sh-hd"><div class="sh-title">여행 목록</div>
      <button class="icon-btn" onclick="closeSheet()">${XICO}</button></div>
    <div class="hint" style="margin:-2px 20px 8px">이름·날짜·인원을 고치려면 연필 아이콘을 누르세요.</div>
    ${rows||'<div class="empty">여행이 없습니다.</div>'}
    <div class="sh-div"></div>
    <button class="mrow" id="btnNewTrip"><span class="mi">➕</span>
      <span class="mrow-t">새 여행 만들기</span></button>`);
}

function sheetTripForm(edit,tripId){
  const t=edit?(DB.trips.find(x=>x.id===tripId)||curTrip()):null;
  const s=t?t.dateStart:todayStr(), e=t?t.dateEnd:addDays(todayStr(),1);
  openSheet(`
    <div class="sh-hd"><div class="sh-title">${edit?'여행 정보':'새 여행'}</div>
      <button class="icon-btn" onclick="closeSheet()">${XICO}</button></div>
    <div class="sh-body">
      <div class="fld"><div class="fld-lab">여행 이름</div>
        <input class="inp" id="f-name" placeholder="예: 제주 가족여행" value="${esc(t?t.name:'')}"></div>
      <div class="fld"><div class="fld-lab">여행 유형</div>
        <div class="chips" id="f-type">${TYPES.map(x=>
          `<button class="chip ${((t?t.type:'domestic')===x.k)?'on':''}" data-type="${x.k}">${x.n}</button>`).join('')}</div></div>
      <div class="hint">유형에 따라 준비물이 달라집니다. 해외면 여권·변환어댑터가 붙고, 국내면 자동차키가 붙습니다.</div>
      <div class="fld"><div class="fld-lab">날짜</div>
        <div class="row2">
          <button class="inp fld-btn" id="f-start"><span id="f-start-t">${fmtFull(s)}</span>${CALICO}</button>
          <button class="inp fld-btn" id="f-end"><span id="f-end-t">${fmtFull(e)}</span>${CALICO}</button>
        </div></div>
      <div class="row2">
        <div class="fld"><div class="fld-lab">인원</div>
          <input class="inp" type="number" id="f-people" min="1" max="30" value="${t?t.people:2}"></div>
        <div class="fld">
          <div class="fld-lab">숙소 (선택)</div>
          <div class="inp-wrap">
            <input class="inp" id="f-stay" placeholder="애월 풀빌라" value="${esc(t?t.stay:'')}">
            <span id="f-stay-search"></span>
          </div></div>
      </div>
      <button class="btn" id="f-save">${edit?'저장':'만들기'}</button>
      ${edit?`<button class="btn ghost" id="f-regen">준비물 다시 생성</button>`:''}
    </div>`);

  let type=t?t.type:'domestic', ds=s, de=e;
  // 해외가 아닐 때만 숙소 장소 검색 버튼 노출 (Daum 우편번호는 국내 전용)
  const staySearch=()=>{
    const box=$('#f-stay-search'), inp=$('#f-stay'), show=type!=='overseas';
    box.innerHTML = show ? `<button class="inp-search" id="f-stay-btn">${PINICO} 검색</button>` : '';
    inp.classList.toggle('has-btn',show);
    const b=$('#f-stay-btn');
    if(b)b.onclick=()=>openPlaceSearch(r=>{inp.value=r.name;});
  };
  staySearch();
  $('#f-type').onclick=ev=>{const b=ev.target.closest('[data-type]');if(!b)return;
    type=b.dataset.type;$('#f-type').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));
    staySearch();};
  // 시작일에는 상한을 두지 않고, 기간(박수)을 유지한 채 종료일이 따라오게 함
  $('#f-start').onclick=()=>openPicker({title:'시작일',date:ds,onDone:d=>{
    const nights=Math.max(0,diffDays(ds,de));
    ds=d; de=addDays(ds,nights);
    $('#f-start-t').textContent=fmtFull(ds);
    $('#f-end-t').textContent=fmtFull(de);}});
  $('#f-end').onclick=()=>openPicker({title:'종료일',date:de,min:ds,onDone:d=>{
    de=d; $('#f-end-t').textContent=fmtFull(de);}});

  $('#f-save').onclick=()=>{
    const name=$('#f-name').value.trim();
    if(!name){toast('여행 이름을 입력해 주세요');return;}
    if(!ds||!de){toast('날짜를 선택해 주세요');return;}
    if(diffDays(ds,de)<0){toast('종료일이 시작일보다 빠릅니다');return;}
    const people=Math.max(1,Number($('#f-people').value)||1);
    const stay=$('#f-stay').value.trim();
    if(edit){
      const cur=t;
      Object.assign(cur,{name,type,dateStart:ds,dateEnd:de,people,stay});
      // 자동 계산 항목만 새 박수·인원으로 재계산 (직접 고친 항목·체크 상태는 유지)
      const rn=nightsOf(cur), rp=cur.people||1;
      (cur.pack||[]).forEach(pi=>{
        if(pi.auto&&NAME_RULE[pi.name]){
          const r=NAME_RULE[pi.name];
          pi.qty=r.q(rn,rp); pi.auto=r.s?r.s(rn,rp):'';
        }
      });
      // 날짜가 줄었으면 범위 밖 일정·메뉴의 day 정리
      const last=daysOf(cur)-1;
      (cur.plans||[]).forEach(p=>{if(p.day>last)p.day=last;});
      (cur.menus||[]).forEach(m=>{if(m.day!=null&&m.day>last)m.day=last;});
      if(cur.id===DB.cur&&UI.day!=null)UI.day=Math.min(UI.day,last);
      toast('저장했습니다');
    }else{
      const nt=newTrip({name,type,dateStart:ds,dateEnd:de,people,stay});
      DB.trips.push(nt); DB.cur=nt.id; UI.tab='today'; UI.day=0;
      toast('여행을 만들었습니다');
    }
    save();closeSheet();render();
  };
  if(edit)$('#f-regen').onclick=()=>{
    const cur=t; const before=cur.pack;
    cur.pack=genPack(cur); save();closeSheet();render();
    toast('준비물을 다시 생성했습니다','되돌리기',()=>{cur.pack=before;save();render();});
  };
}

/* 내 기본 준비물 관리 — 여행과 무관하게 기본 목록을 직접 편집 */
function sheetPackTemplate(){
  const tplType=DB.packTemplateType||'domestic';
  let items;
  if(Array.isArray(DB.packTemplate)&&DB.packTemplate.length){
    items=DB.packTemplate.map(x=>({...x}));
  }else{
    // 아직 템플릿이 없으면 앱 기본(국내)에서 시작
    items=[];
    PACK_TPL.forEach(g=>g.items.forEach(it=>{
      if(it.only&&!it.only.includes(tplType))return;
      items.push({cat:g.cat,name:it.n});
    }));
  }
  let sel=null;
  const draw=()=>{
    const sc=$('#sheet').scrollTop;
    const cats=orderedPackCats().filter(c=>c.cat!=='아이스박스'&&c.cat!=='조리도구');
    if(sel==null)sel=cats[0].cat;
    const secs=cats.map(c=>{
      const list=items.filter(x=>x.cat===c.cat);
      return `<div class="sec" style="margin:0 20px 10px;border:1px solid var(--sep)">
        <div class="sec-hd"><div class="sec-title">${c.ic} ${esc(c.cat)}</div>
          <div class="sec-note">${list.length}개</div></div>
        ${list.map(x=>`<div class="row">
          <div class="grow"><div class="txt">${esc(x.name)}</div></div>
          <button class="del-x" data-tdel="${esc(c.cat)}|${esc(x.name)}">${XICO}</button>
        </div>`).join('')||'<div class="empty" style="padding:14px">항목 없음</div>'}
      </div>`;
    }).join('');
    openSheet(`
      <div class="sh-hd"><div class="sh-title">내 기본 준비물</div>
        <button class="icon-btn" onclick="closeSheet()">${XICO}</button></div>
      <div class="hint" style="margin:0 20px 12px">새 여행을 만들 때 이 목록으로 준비물이 생성됩니다.
        상의·칫솔 등 수량은 여행마다 자동 계산되고, 여권 같은 유형 전용 항목은 여행 유형에 따라 자동으로 붙거나 빠집니다.</div>
      ${secs}
      <div class="sh-body" style="padding-top:6px">
        <div class="fld"><div class="fld-lab">항목 추가</div>
          <input class="inp" id="tp-name" placeholder="예: 카메라 배터리"></div>
        <div class="fld"><div class="fld-lab">분류</div>
          <div class="chips" id="tp-cat">${cats.map(c=>
            `<button class="chip ${c.cat===sel?'on':''}" data-c="${esc(c.cat)}">${c.ic} ${c.cat}</button>`).join('')}</div></div>
        <button class="btn ghost" id="tp-add" style="color:var(--label);margin-top:0">＋ 목록에 추가</button>
        <button class="btn" id="tp-save">이 목록을 기본값으로 저장</button>
        ${DB.packTemplate?`<button class="btn ghost" id="tp-reset">기본값 삭제 (앱 기본 사용)</button>`:''}
      </div>`);
    $('#sheet').scrollTop=sc;
    $('#tp-cat').onclick=ev=>{const b=ev.target.closest('[data-c]');if(!b)return;
      sel=b.dataset.c;$('#tp-cat').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));};
    $('#sheet').querySelectorAll('[data-tdel]').forEach(b=>b.onclick=()=>{
      const v=b.dataset.tdel, i=v.indexOf('|');
      const cat=v.slice(0,i), name=v.slice(i+1);
      const ix=items.findIndex(x=>x.cat===cat&&x.name===name);
      if(ix>=0){items.splice(ix,1);draw();}
    });
    $('#tp-add').onclick=()=>{
      const n=$('#tp-name').value.trim();
      if(!n){toast('항목을 입력해 주세요');return;}
      if(items.some(x=>x.name===n&&x.cat===sel)){toast('이미 있는 항목입니다');return;}
      items.push({cat:sel,name:n});
      draw();
    };
    $('#tp-save').onclick=()=>{
      DB.packTemplate=items.map(x=>({...x}));
      DB.packTemplateType=tplType;
      save();closeSheet();render();
      toast(`내 기본 준비물을 저장했습니다 (${items.length}개)`);
    };
    const rst=$('#tp-reset');
    if(rst)rst.onclick=()=>{
      if(!confirm('내 기본 준비물을 지우고 앱 기본으로 되돌릴까요?\n(이미 만든 여행은 그대로입니다)'))return;
      delete DB.packTemplate; delete DB.packTemplateType;
      save();closeSheet();render();toast('앱 기본으로 되돌렸습니다');
    };
  };
  draw();
}

function sheetMenuEdit(menuId){
  const t=curTrip();
  const m=menuId?t.menus.find(x=>x.id===menuId):null;
  const D=daysOf(t);
  const ingText=m?(m.ing||[]).map(i=>`${i.n}, ${i.q}${i.u}, ${i.c}`).join('\n'):'';
  const gearText=m?(m.gear||[]).join(', '):'';
  openSheet(`
    <div class="sh-hd"><div class="sh-title">${m?'메뉴 편집':'메뉴 추가'}</div>
      <button class="icon-btn" onclick="closeSheet()">${XICO}</button></div>
    <div class="sh-body">
      <div class="row2">
        <div class="fld" style="flex:0 0 76px"><div class="fld-lab">아이콘</div>
          <input class="inp" id="m-emoji" maxlength="4" style="text-align:center"
            value="${esc(m?m.emoji:EMOJIS[Math.floor(Math.random()*EMOJIS.length)])}"></div>
        <div class="fld"><div class="fld-lab">메뉴 이름</div>
          <input class="inp" id="m-name" placeholder="예: 떡볶이" autocomplete="off"
            value="${esc(m?m.name:'')}"></div>
      </div>
      <div class="sug" id="m-sug"></div>
      <div class="fld"><div class="fld-lab">언제 먹나요 (선택)</div>
        <div class="chips" id="m-day">
          <button class="chip ${(!m||m.day==null)?'on':''}" data-day="">미정</button>
          ${Array.from({length:D},(_,i)=>
            `<button class="chip ${(m&&m.day===i)?'on':''}" data-day="${i}">Day ${i+1}</button>`).join('')}
        </div></div>
      <div class="fld"><div class="fld-lab">재료</div>
        <textarea class="inp" id="m-ing" placeholder="당근&#10;삼겹살 300g&#10;대파, 1단, 채소">${esc(ingText)}</textarea></div>
      <div class="hint">메뉴 이름을 입력하면 레시피 ${RECIPES.length}종에서 찾아 재료를 채워줍니다.
        직접 적을 땐 한 줄에 하나씩 — <b>이름만 써도</b> 분류·단위를 자동으로 채웁니다 (당근 → 당근·1개·채소).
        수량은 이름 뒤에 붙이면 되고(삼겹살 300g), 분류를 직접 정하려면 <b>이름, 수량단위, 분류</b>.
        분류는 ${MKT_CATS.join(' / ')} 중 하나입니다.</div>
      <div class="fld"><div class="fld-lab">조리도구 (선택)</div>
        <input class="inp" id="m-gear" placeholder="예: 버너, 냄비, 집게" value="${esc(gearText)}"></div>
      <div class="hint">쉼표로 구분해 적습니다. 여기 적은 도구는 <b>준비물 › 조리도구</b>에 자동으로 챙겨지고,
        여러 메뉴가 같은 도구를 쓰면 하나로 합쳐집니다. 부탄가스·식용유는 사는 것이라 재료에 둡니다.</div>
      <button class="btn" id="m-save">저장</button>
      ${m?`<button class="btn ghost" id="m-del2">이 메뉴 삭제</button>`:''}
    </div>`);

  let day=m?m.day:null;
  $('#m-day').onclick=ev=>{const b=ev.target.closest('[data-day]');if(!b)return;
    day=b.dataset.day===''?null:Number(b.dataset.day);
    $('#m-day').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));};

  // ---- 레시피 자동완성 ----
  const people=t.people||1, nameInp=$('#m-name'), sug=$('#m-sug');
  nameInp.oninput=()=>{
    const res=searchRecipes(nameInp.value);
    if(!res.length){sug.classList.remove('on');sug.innerHTML='';return;}
    sug.innerHTML=res.map((r,i)=>`<button class="sug-row" data-sug="${i}">
      <span class="sug-e">${esc(r.emoji||'🍽')}</span>
      <span class="grow"><div class="sug-n">${esc(r.name)}</div>
        <div class="sug-i">${esc(r.ing.map(x=>x.n).join(' · '))}</div></span>
      <span class="sug-tag ${r.mine?'mine':''}">${r.mine?'내 메뉴':'레시피'}</span></button>`).join('');
    sug.classList.add('on');
    sug.querySelectorAll('[data-sug]').forEach(b=>b.onclick=()=>{
      const r=res[Number(b.dataset.sug)];
      nameInp.value=r.name;
      $('#m-emoji').value=r.emoji||'🍽';
      // 내장 레시피는 1인분 기준이라 인원수만큼 환산 / 내 메뉴는 저장된 값 그대로
      const list=r.mine?r.ing.map(x=>({...x})):scaleIng(r.ing,people);
      // 버너를 쓰면 부탄가스(소모품)를 재료로 추가 (A안)
      if(gearNeedsGas(r.gear)&&!list.some(x=>x.n==='부탄가스'))list.push({n:'부탄가스',q:1,u:'개',c:'기타'});
      $('#m-ing').value=list.map(x=>`${x.n}, ${x.q}${x.u}, ${x.c}`).join('\n');
      $('#m-gear').value=(r.gear||[]).join(', ');
      sug.classList.remove('on');
      toast(r.mine?`내 메뉴 · ${r.people}명 기준으로 저장된 값입니다`
                  :`${r.name} · ${people}명 기준으로 채웠습니다`);
    });
  };

  $('#m-save').onclick=()=>{
    const name=$('#m-name').value.trim();
    if(!name){toast('메뉴 이름을 입력해 주세요');return;}
    const ing=parseIng($('#m-ing').value);
    const gear=$('#m-gear').value.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
    const emoji=$('#m-emoji').value.trim()||'🍽';
    if(m){Object.assign(m,{name,emoji,day,ing,gear});}
    else{t.menus.push({id:uid(),name,emoji,day,picked:true,ing,gear});}
    if(ing.length||gear.length)saveToLibrary(name,emoji,ing,people,gear);   // 내 사전에 쌓기
    save();closeSheet();render();toast(m?'저장했습니다':'메뉴를 추가했습니다');
  };
  if(m)$('#m-del2').onclick=()=>{
    const idx=t.menus.findIndex(x=>x.id===m.id);
    const removed=t.menus.splice(idx,1)[0];
    save();closeSheet();render();
    toast('삭제했습니다','되돌리기',()=>{t.menus.splice(idx,0,removed);save();render();});
  };
}

/* 메뉴 하나에 필요한 것 묶음 — 조리도구 / 소모품 / 재료를 한 화면에.
   장보기(매대별 합산)와 반대 시선: "이 메뉴 한 상 차리려면 뭐가 필요한가" */
function sheetMenuBundle(menuId){
  const t=curTrip();
  const draw=()=>{
    const m=(t.menus||[]).find(x=>x.id===menuId);
    if(!m){closeSheet();return;}
    const sc=$('#sheet')?$('#sheet').scrollTop:0;
    const bought=new Set(t.bought||[]);
    // 담긴 메뉴들끼리 함께 쓰는 도구 → '공유' 표시 (준비물엔 하나만 챙기면 됨)
    const share={};
    (t.menus||[]).filter(x=>x.picked).forEach(x=>(x.gear||[]).forEach(g=>{share[g]=(share[g]||0)+1;}));
    const gear=m.gear||[], ing=m.ing||[];
    const relib=()=>saveToLibrary(m.name,m.emoji,m.ing,t.people||1,m.gear);

    const gearRow=(name,gi)=>{
      const pi=t.pack.find(p=>p.cat==='조리도구'&&p.name===name);
      const done=pi?pi.done:false, shared=(share[name]||0)>1;
      return `<div class="row ${done?'done':''}">
        <button class="cb ${done?'on':''}" ${pi?`data-bgear="${esc(name)}"`:'disabled style="opacity:.4"'}>${CHECK}</button>
        <button class="grow tap" data-gedit="${gi}"><div class="txt">${esc(name)}</div>

  const back=()=>sheetMenuBundle(menuId);
  const editing=spec.index!=null;

  if(spec.kind==='gear'){
    const cur=editing?m.gear[spec.index]:'';
    openSheet(`
      <div class="sh-hd"><div class="sh-title">${editing?'도구 편집':'도구 추가'}</div>
        <button class="icon-btn" id="bi-x">${XICO}</button></div>

        <button class="btn" id="bi-save">${editing?'저장':'추가'}</button>

      relib(); save();render();back(); toast(editing?'저장했습니다':'도구를 추가했습니다');
    };
    if(editing)$('#bi-del').onclick=()=>{m.gear.splice(spec.index,1);relib();save();render();back();toast('삭제했습니다');};
    return;
  }

  // 재료
  const cur=editing?m.ing[spec.index]:null;
  let sel=cur?cur.c:'', catManual=!!cur;
  const qv=cur?((Number.isInteger(cur.q)?cur.q:Number(cur.q.toFixed(2)))+(cur.u||'')):'';
  openSheet(`
    <div class="sh-hd"><div class="sh-title">${editing?'재료 편집':'재료 추가'}</div>
      <button class="icon-btn" id="bi-x">${XICO}</button></div>

        <input class="inp" id="bi-name" placeholder="예: 당근" value="${esc(cur?cur.n:'')}"></div>
      <div class="fld"><div class="fld-lab">수량</div>
        <input class="inp" id="bi-qty" placeholder="예: 2개 (비워두면 1개)" value="${esc(qv)}"></div>
      <div class="fld"><div class="fld-lab">분류</div>
        <div class="chips" id="bi-cat">${MKT_CATS.map(c=>
          `<button class="chip ${c===sel?'on':''}" data-c="${esc(c)}">${MKT_IC[c]} ${c}</button>`).join('')}</div></div>
      <div class="hint">이름만 넣어도 분류·단위가 자동으로 채워집니다. 분류는 직접 골라도 됩니다.</div>
      <button class="btn" id="bi-save">${editing?'저장':'추가'}</button>
      ${editing?`<button class="btn ghost" id="bi-del">이 재료 삭제</button>`:''}
    </div>`);
  $('#bi-x').onclick=back;
  const setCat=c=>{sel=c;$('#bi-cat').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.c===c));};
  $('#bi-cat').onclick=ev=>{const b=ev.target.closest('[data-c]');if(!b)return;
    if(b.dataset.c===sel){          // 이미 선택된 분류를 다시 누르면 취소 → 자동 분류로 복귀
      catManual=false;
      const h=ingHint(nameInp.value.trim());
      setCat(h?h.c:'');
    }else{catManual=true;setCat(b.dataset.c);}};
  const nameInp=$('#bi-name');
  nameInp.oninput=()=>{if(catManual)return;const h=ingHint(nameInp.value.trim());if(h)setCat(h.c);};
  if(!editing)setTimeout(()=>nameInp.focus(),60);

    const parsed=parseIng(`${name.replace(/,/g,' ')}, ${$('#bi-qty').value.trim()}, ${sel}`)[0]

}

// "당근, 2개, 채소" → {n:'당근',q:2,u:'개',c:'채소'}
// 이름만 써도 됨. '이름' / '이름 300g' / '이름, 2개' / '이름, 2개, 채소' 모두 허용.
// 분류·단위를 안 쓰면 사전(ingHint)에서 자동으로 채움.
function parseIng(text){
  return String(text||'').split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
    const p=line.split(',').map(x=>x.trim());
    let n, qu='', c='';
    if(p.length>=2){ n=p[0]; qu=p[1]; c=p[2]||''; }
    else{
      // 쉼표 없이 '이름 수량단위' — 이름 뒤 공백 다음이 숫자로 시작하면 수량으로 분리
      const s=p[0]||'', mm=s.match(/^(.+?)\s+([\d.].*)$/);
      if(mm){ n=mm[1].trim(); qu=mm[2].trim(); } else n=s;
    }
    if(!n)return null;
    const hint=ingHint(n);
    // 수량·단위
    let q=1, u='';
    if(qu){
      const m2=qu.match(/^([\d.]+)\s*(.*)$/);
      if(m2){ q=parseFloat(m2[1]); u=(m2[2]||'').trim(); } else u=qu;
    }
    if(isNaN(q))q=1;
    if(!u)u=(hint&&hint.u)||'개';
    // 분류: 직접 지정한 게 유효하면 그것, 아니면 사전, 그래도 없으면 기타
    if(!MKT_CATS.includes(c))c=(hint&&hint.c)||'기타';
    return {n,q,u,c};
  }).filter(Boolean);
}

// 이 장보기 항목이 실제로 어디에 들어있나 (메뉴 재료 / 직접 항목)
function buyHomes(t,key){
  const menus=(t.menus||[]).filter(m=>(m.ing||[]).some(i=>i.n+'|'+(i.u||'')===key));
  const extra=(t.extras||[]).find(x=>x.n+'|'+(x.u||'')===key);
  return {menus,extra};
}

    sel=b.dataset.c;$('#b-cat').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));};
  const mb=$('#b-menu');
  if(mb)mb.onclick=ev=>{const b=ev.target.closest('[data-m]');if(!b)return;

    const mm=raw.match(/^([\d.]+)\s*(.*)$/);
    const nq=mm?parseFloat(mm[1]):1, nu=mm?(mm[2]||'개'):raw;
    if(!single){   // 합쳐진 항목: 수량·분류만 덮어씀
      t.overrides=t.overrides||{};
      t.overrides[key]={q:isNaN(nq)?1:nq,u:nu,c:sel};
      save();closeSheet();render();toast('저장했습니다');return;
    }
    const nn=$('#b-name').value.trim();
    if(!nn){toast('품목을 입력해 주세요');return;}
    // 현재 위치에서 제거
    if(inExtra)t.extras=t.extras.filter(x=>x.n+'|'+(x.u||'')!==key);
    else if(curMenuId){const cm=t.menus.find(m=>m.id===curMenuId);
      cm.ing=(cm.ing||[]).filter(i=>i.n+'|'+(i.u||'')!==key);
      saveToLibrary(cm.name,cm.emoji,cm.ing,t.people||1,cm.gear);}
    if(t.overrides)delete t.overrides[key];
    // 새 위치에 추가
    if(target){const tm=t.menus.find(m=>m.id===target);
      tm.ing=tm.ing||[]; tm.ing.push({n:nn,q:isNaN(nq)?1:nq,u:nu,c:sel}); tm.picked=true;
      saveToLibrary(tm.name,tm.emoji,tm.ing,t.people||1,tm.gear);}
    else t.extras.push({n:nn,q:isNaN(nq)?1:nq,u:nu,c:sel});
    const newKey=nn+'|'+nu;
    t.excluded=(t.excluded||[]).filter(k=>k!==newKey&&k!==key);
    save();closeSheet();render();
    const where=target?t.menus.find(m=>m.id===target).name:'직접 항목';
    toast(`저장했습니다 · ${where}`);
  };
  $('#b-del').onclick=()=>{closeSheet();deleteBuyItem(key);};
}

function deleteBuyItem(key){
  const t=curTrip();
  const name=(mergeMarket(t).find(i=>i.key===key)||{}).n||'항목';
  if(!confirm(`'${name}' 삭제할까요?`))return;
  const before={extras:(t.extras||[]).slice(),excluded:(t.excluded||[]).slice()};
  t.extras=(t.extras||[]).filter(x=>x.n+'|'+(x.u||'')!==key);
  t.excluded=t.excluded||[];
  if(!t.excluded.includes(key))t.excluded.push(key);
  save();render();
  toast(`'${name}' 뺐습니다`,'되돌리기',()=>{
    t.extras=before.extras;t.excluded=before.excluded;save();render();
  });
}

/* ================= Dropbox 동기화 ================= */
const DBX={KEY:'tripprep_dbx_appkey',TOKEN:'tripprep_dbx_token',REFRESH:'tripprep_dbx_refresh',
  VERIFIER:'tripprep_dbx_verifier',LAST:'tripprep_dbx_lastsync',PRESYNC:'tripprep_backup_presync'};
const DBX_FILE='/01_Personal/Trip-Prep/trip-prep_data.json';   // 한글 경로 회피
const dbxRedirect=()=>location.origin+location.pathname.replace(/[^/]*$/,'')+'history.html';
const dbxAppKey=()=>localStorage.getItem(DBX.KEY)||'';
const dbxConnected=()=>!!(localStorage.getItem(DBX.REFRESH)&&dbxAppKey());

const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)))
  .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

async function dbxConnect(appKey){
  localStorage.setItem(DBX.KEY,appKey);
  const verifier=b64url(crypto.getRandomValues(new Uint8Array(48)));
  localStorage.setItem(DBX.VERIFIER,verifier);
  const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier));
  const p=new URLSearchParams({client_id:appKey,redirect_uri:dbxRedirect(),response_type:'code',
    code_challenge:b64url(digest),code_challenge_method:'S256',token_access_type:'offline'});
  location.href='https://www.dropbox.com/oauth2/authorize?'+p;
}
async function dbxExchange(code){
  const appKey=dbxAppKey(), verifier=localStorage.getItem(DBX.VERIFIER);
  if(!appKey||!verifier)return false;
  try{
    const res=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({code,grant_type:'authorization_code',client_id:appKey,
        redirect_uri:dbxRedirect(),code_verifier:verifier})});
    const d=await res.json();
    if(d.access_token){
      localStorage.setItem(DBX.TOKEN,d.access_token);
      if(d.refresh_token)localStorage.setItem(DBX.REFRESH,d.refresh_token);
      localStorage.removeItem(DBX.VERIFIER); return true;
    }
  }catch(e){}
  return false;
}
async function dbxToken(){
  const refresh=localStorage.getItem(DBX.REFRESH), appKey=dbxAppKey();
  if(!refresh||!appKey)return localStorage.getItem(DBX.TOKEN)||null;
  try{
    const res=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({grant_type:'refresh_token',refresh_token:refresh,client_id:appKey})});
    const d=await res.json();
    if(d.access_token){localStorage.setItem(DBX.TOKEN,d.access_token);return d.access_token;}
  }catch(e){}
  return localStorage.getItem(DBX.TOKEN)||null;
}
async function dbxUpload(token,body){
  const res=await fetch('https://content.dropboxapi.com/2/files/upload',{method:'POST',
    headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/octet-stream',
      'Dropbox-API-Arg':JSON.stringify({path:DBX_FILE,mode:'overwrite',autorename:false,mute:true})},
    body});
  return res.ok;
}
async function dbxDownload(token){
  const res=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',
    headers:{'Authorization':`Bearer ${token}`,'Dropbox-API-Arg':JSON.stringify({path:DBX_FILE})}});
  if(!res.ok)return null;
  try{return JSON.parse(await res.text());}catch(e){return null;}
}

let dbxTimer=null;
function dbxScheduleSync(){
  if(!dbxConnected())return;
  clearTimeout(dbxTimer);
  dbxTimer=setTimeout(dbxPush,3000);   // 연속 입력 중 업로드 폭주 방지
}
async function dbxPush(){
  if(!dbxConnected())return false;
  const token=await dbxToken(); if(!token)return false;
  const payload={...DB,syncedAt:new Date().toISOString()};
  const ok=await dbxUpload(token,JSON.stringify(payload));
  if(ok)localStorage.setItem(DBX.LAST,payload.syncedAt);
  return ok;
}
async function dbxPull(silent){
  if(!dbxConnected())return;
  const token=await dbxToken();
  if(!token){if(!silent)toast('Dropbox 인증이 만료됐습니다');return;}
  const remote=await dbxDownload(token);
  if(!remote||!Array.isArray(remote.trips)){
    const ok=await dbxPush(); if(!silent)toast(ok?'Dropbox에 처음 저장했습니다':'동기화 실패'); return;
  }
  const localLast=localStorage.getItem(DBX.LAST)||'', remoteAt=remote.syncedAt||'';
  if(remoteAt&&remoteAt>localLast){
    localStorage.setItem(DBX.PRESYNC,JSON.stringify(DB));      // 덮어쓰기 전 로컬 사본
    DB=migrate(remote);
    if(!curTrip())DB.cur=DB.trips.length?DB.trips[0].id:null;
    localStorage.setItem(KEY,JSON.stringify(DB));
    localStorage.setItem(DBX.LAST,remoteAt);
    render(); if(!silent)toast('Dropbox에서 불러왔습니다');
  }else{
    const ok=await dbxPush(); if(!silent)toast(ok?'Dropbox에 저장했습니다':'동기화 실패');
  }
}

function sheetDropbox(){
  const on=dbxConnected(), last=localStorage.getItem(DBX.LAST);
  openSheet(`
    <div class="sh-hd"><div class="sh-title">Dropbox 동기화</div>
      <button class="icon-btn" onclick="closeSheet()">${XICO}</button></div>
    <div class="sh-body">
    ${on?`
      <div class="banner g"><div class="bi">☁️</div><div>
        <div class="banner-t">연결됨</div>
        <div class="banner-d">${last?'마지막 동기화 '+new Date(last).toLocaleString('ko-KR'):'아직 동기화 전'}
          <br>내용을 바꾸면 몇 초 뒤 자동으로 올라갑니다.</div></div></div>
      <button class="btn" id="d-sync">지금 동기화</button>
      <button class="btn ghost" id="d-off">연결 해제</button>
    `:`
      <div class="fld"><div class="fld-lab">Dropbox App Key</div>
        <input class="inp" id="d-key" placeholder="앱 키 입력" value="${esc(dbxAppKey())}"></div>
      <div class="hint">
        1. Dropbox 개발자 콘솔에서 앱 생성 — Scoped access · Full Dropbox<br>
        2. Permissions 탭에서 <b>files.content.write</b>, <b>files.content.read</b> 체크 후 Submit<br>
        3. Settings 탭 → Redirect URIs 에 아래 주소 추가<br>
        &nbsp;&nbsp;<code>${esc(dbxRedirect())}</code><br>
        4. App key 를 복사해 위에 입력
      </div>
      <button class="btn" id="d-connect">Dropbox 연결하기</button>
    `}
      <div class="hint" style="margin-top:16px">저장 위치 <code>${DBX_FILE}</code></div>
    </div>`);
  if(on){
    $('#d-sync').onclick=async()=>{closeSheet();toast('동기화 중...');await dbxPull(false);};
    $('#d-off').onclick=()=>{
      if(!confirm('Dropbox 연결을 해제할까요?\n이 기기의 데이터는 그대로 남습니다.'))return;
      [DBX.TOKEN,DBX.REFRESH,DBX.LAST].forEach(k=>localStorage.removeItem(k));
      closeSheet();render();toast('연결을 해제했습니다');
    };
  }else{
    $('#d-connect').onclick=()=>{
      const k=$('#d-key').value.trim();
      if(!k){toast('App Key를 입력해 주세요');return;}
      dbxConnect(k);
    };
  }
}

function importJSON(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d||!Array.isArray(d.trips))throw new Error('형식이 올바르지 않습니다');
        if(!confirm(`여행 ${d.trips.length}개를 불러옵니다.\n현재 데이터는 덮어씌워집니다. 계속할까요?`))return;
        DB=migrate(d); if(!DB.cur||!curTrip())DB.cur=DB.trips.length?DB.trips[0].id:null;
        save();closeSheet();render();toast('불러왔습니다');
      }catch(e){toast('불러오기 실패: '+e.message);}
    };
    r.readAsText(f);
  };
  inp.click();
}
