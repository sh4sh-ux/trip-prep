  const T=ev.target;
  // 드래그 직후 브라우저가 만드는 합성 click만 무시 (짧은 시간창). 영구 플래그면
  // 합성 click이 안 생기는 경우 다음 실제 탭을 삼켜서 버튼이 안 눌리는 버그가 남음
  if(dragEndedAt&&Date.now()-dragEndedAt<400){dragEndedAt=0;return;}
  if(T.closest('.drag-h'))return;                  // 핸들 클릭은 토글 아님

  if(T.closest('#btnNewTrip')){sheetTripForm(false);return;}
  if(T.closest('#btnTrips')){sheetTrips();return;}
  if(T.closest('#btnMenu')){sheetDataMenu();return;}

  const et=T.closest('[data-edittrip]');
  if(et){sheetTripForm(true,et.dataset.edittrip);return;}
  const sw=T.closest('[data-switch]');
  if(sw){DB.cur=sw.dataset.switch;UI.tab='today';UI.day=null;save();closeSheet();render();return;}

  const tab=T.closest('[data-tab]');
  if(tab){UI.tab=tab.dataset.tab;render();window.scrollTo(0,0);return;}

  const seg=T.closest('[data-seg]');
  if(seg){UI.seg=seg.dataset.seg;render();return;}

  const day=T.closest('[data-day]');
  if(day&&day.classList.contains('dchip')){UI.day=Number(day.dataset.day);render();return;}

  const cat=T.closest('[data-cat]');
  if(cat){const c=cat.dataset.cat;UI.openCats[c]=!UI.openCats[c];render();return;}

  const ck=T.closest('[data-chk]');
  if(ck){
    const t=curTrip(); t.chk=t.chk||{dep:[],ret:[]};
    const [kind,label]=ck.dataset.chk.split('|');
    const arr=t.chk[kind]=t.chk[kind]||[];
    const i=arr.indexOf(label);
    if(i>=0)arr.splice(i,1); else arr.push(label);
    save();render();return;
  }

  const mcat=T.closest('[data-mktcat]');
  if(mcat){const c=mcat.dataset.mktcat;UI.mktClosed[c]=!UI.mktClosed[c];render();return;}
  if(T.closest('#mktToggleAll')){
    const t=curTrip(), cats=MKT_CATS.filter(c=>mergeMarket(t).some(i=>i.c===c));
    const anyOpen=cats.some(c=>!UI.mktClosed[c]);
    cats.forEach(c=>{UI.mktClosed[c]=anyOpen;});   // 하나라도 열려 있으면 전부 접기, 아니면 전부 펼치기
    render();return;
  }

  const dp=T.closest('[data-delpack]');
  if(dp){
    const t=curTrip(),id=dp.dataset.delpack;
    const idx=t.pack.findIndex(p=>p.id===id);
    if(idx<0)return;
    if(!confirm(`'${t.pack[idx].name}' 삭제할까요?`))return;
    const removed=t.pack.splice(idx,1)[0];
    save();render();
    toast(`'${removed.name}' 삭제`,'되돌리기',()=>{t.pack.splice(idx,0,removed);save();render();});
    return;
  }
  const pk=T.closest('[data-pack]');
  if(pk){
    const t=curTrip(),p=t.pack.find(x=>x.id===pk.dataset.pack);
    if(p){p.done=!p.done;save();render();}
    return;
  }

  if(T.closest('#menuMoreToggle')){UI.menuMoreOpen=!UI.menuMoreOpen;render();return;}

  const mn=T.closest('[data-menu]');
  if(mn){
    const t=curTrip(),m=t.menus.find(x=>x.id===mn.dataset.menu);
    if(m){m.picked=!m.picked;save();render();}
    return;
  }
  const mbd=T.closest('[data-menubundle]');
  if(mbd){sheetMenuBundle(mbd.dataset.menubundle);return;}
  const om=T.closest('[data-openmenu]');
  if(om){sheetMenuBundle(om.dataset.openmenu);return;}
  if(T.closest('#btnAddMenu')){sheetMenuEdit(null);return;}
  if(T.closest('#btnImportMenus')){sheetImportMenus();return;}
  const imp=T.closest('[data-imp]');
  if(imp){importMenusFrom(imp.dataset.imp);return;}

  const eb=T.closest('[data-editbuy]');
  if(eb){sheetEditBuy(eb.dataset.editbuy);return;}
  const db=T.closest('[data-delbuy]');
  if(db){deleteBuyItem(db.dataset.delbuy);return;}

  const by=T.closest('[data-buy]');
  if(by){
    const t=curTrip(),k=by.dataset.buy;
    t.bought=t.bought||[];
    const i=t.bought.indexOf(k);
    if(i>=0)t.bought.splice(i,1); else t.bought.push(k);
    save();render();
    return;
  }

  if(T.closest('#btnPackSort')){
    UI.packSort=!UI.packSort;
    if(UI.packSort)UI.openCats={};   // 정렬 모드 진입 시 전부 접어 카테고리 이동을 쉽게
    render();return;
  }
  if(T.closest('#btnMktSort')){
    UI.mktSort=!UI.mktSort;
    if(UI.mktSort)MKT_CATS.forEach(c=>{UI.mktClosed[c]=true;});   // 진입 시 매대 전부 접어 이동 쉽게
    render();return;
  }
  if(T.closest('#btnSavePackTpl')){
    const t=curTrip(); savePackTemplate(t); save();
    toast(`이 준비물(${DB.packTemplate.length}개)을 기본값으로 저장했습니다`);
    return;
  }
  if(T.closest('#btnResetPackTpl')){
    if(!confirm('내 기본 준비물을 지우고 앱 기본으로 되돌릴까요?\n(이미 만든 여행은 그대로입니다)'))return;
    delete DB.packTemplate; delete DB.packTemplateType; save(); render();
    toast('앱 기본 준비물로 되돌렸습니다');
    return;
  }
  const ap=T.closest('[data-addpack]');
  if(ap){sheetPack(ap.dataset.addpack,null);return;}
  const ep=T.closest('[data-editpack]');
  if(ep){sheetPack(null,ep.dataset.editpack);return;}
  if(T.closest('#btnAddExtra')){sheetAddExtra();return;}
  if(T.closest('#btnAddPlan')){sheetPlan(null);return;}
  const epl=T.closest('[data-editplan]');
  if(epl){sheetPlan(epl.dataset.editplan);return;}

  const delp=T.closest('[data-delplan]');
  if(delp){
    const t=curTrip(),id=delp.dataset.delplan;
    const idx=t.plans.findIndex(p=>p.id===id);
    if(idx<0)return;
    if(!confirm('이 일정을 삭제할까요?'))return;
    const removed=t.plans.splice(idx,1)[0];
    save();render();
    toast('일정 삭제','되돌리기',()=>{t.plans.splice(idx,0,removed);save();render();});
    return;
  }
});

/* ---- 준비물 순서: ≡ 핸들을 누른 채 드래그 (카드가 손가락을 따라 움직임) ---- */
let DRG=null, dragEndedAt=0;
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.drag-h'); if(!h)return;
  const kind=h.dataset.kind;
  const el=kind==='item'?h.closest('.row'):h.closest('.acc');
  if(!el)return;
  e.preventDefault();
  const r=el.getBoundingClientRect();
  DRG={kind,el,container:el.parentElement,grabDY:e.clientY-r.top,h:r.height,ty:0,moved:false};
  el.classList.add('dragging');
  try{h.setPointerCapture(e.pointerId);}catch(_){}
});
document.addEventListener('pointermove',e=>{
  if(!DRG)return;
  e.preventDefault();
  const {el,container}=DRG;
  const sel=DRG.kind==='item'?'[data-rowid]':'[data-sortcat]';
  // 카드가 손가락을 따라오도록 transform
  const targetTop=e.clientY-DRG.grabDY;
  const layoutTop=el.getBoundingClientRect().top-DRG.ty;
  DRG.ty=targetTop-layoutTop;
  if(Math.abs(DRG.ty)>3)DRG.moved=true;
  el.style.transform=`translateY(${DRG.ty}px)`;
  // 카드의 시각적 중심이 이웃 중심을 지나면 자리 교체 (한 번에 한 칸)
  const centerY=targetTop+DRG.h/2;
  const near=dir=>{let x=dir>0?el.nextElementSibling:el.previousElementSibling;
    while(x&&!x.matches(sel))x=dir>0?x.nextElementSibling:x.previousElementSibling;return x;};
  const prev=near(-1), next=near(1);
  let swapped=false;
  if(prev){const pr=prev.getBoundingClientRect();
    if(centerY<pr.top+pr.height/2){container.insertBefore(el,prev);swapped=true;}}
  if(!swapped&&next){const nr=next.getBoundingClientRect();
    if(centerY>nr.top+nr.height/2){next.after(el);swapped=true;}}
  if(swapped){
    // DOM 이동으로 레이아웃 위치가 바뀌었으니 transform 재계산 (손가락 아래 유지)
    const nl=el.getBoundingClientRect().top-DRG.ty;
    DRG.ty=targetTop-nl;
    el.style.transform=`translateY(${DRG.ty}px)`;
  }
});
function dragEnd(commit){
  if(!DRG)return;
  const {kind,el,container,moved}=DRG;
  el.classList.remove('dragging'); el.style.transform='';
  DRG=null;
  if(moved)dragEndedAt=Date.now();   // 드래그 직후 발생하는 합성 click이 헤더를 토글하지 않게
  const t=curTrip(); if(!t)return;
  if(!moved||!commit){render();return;}   // 이동 없거나 취소면 원상 복구
  const mkt=UI.tab==='market';
  if(kind==='cat'){
    const order=[...container.querySelectorAll('[data-sortcat]')].map(x=>x.dataset.sortcat);
    if(mkt)DB.mktOrder=order; else DB.catOrder=order;
  }else if(mkt){
    // 장볼 것: 전체 화면의 현재 표시 순서로 buyOrder 재구성 (없어진 항목은 자동 정리)
    const secEl=el.closest('.sec');
    t.buyOrder=[...secEl.querySelectorAll('[data-rowid]')].map(x=>x.dataset.rowid);
  }else{
    const cat=el.dataset.rowcat;
    const ids=[...container.querySelectorAll('[data-rowid]')].map(x=>x.dataset.rowid);
    const mine=ids.map(id=>t.pack.find(p=>p.id===id)).filter(Boolean);
    const idxFirst=t.pack.findIndex(p=>p.cat===cat);
    const rest=t.pack.filter(p=>p.cat!==cat);
    rest.splice(Math.max(0,Math.min(idxFirst,rest.length)),0,...mine);
    t.pack=rest;
  }
  save();render();
}
document.addEventListener('pointerup',()=>dragEnd(true));
document.addEventListener('pointercancel',()=>dragEnd(false));

window.closeSheet=closeSheet;
render();

/* ---- OAuth 콜백 처리 · 시작 시 동기화 ---- */
(async()=>{
  const code=new URLSearchParams(location.search).get('code');
  if(code){
    const ok=await dbxExchange(code);
    history.replaceState({},'',location.pathname);
    if(ok){toast('Dropbox에 연결됐습니다');await dbxPull(false);}
    else toast('Dropbox 연결에 실패했습니다');
  }else if(dbxConnected()){
    dbxPull(true);
  }
})();

/* ---- 서비스워커 ---- */
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
